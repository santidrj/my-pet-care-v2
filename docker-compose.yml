services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: my_pet_care
      POSTGRES_PASSWORD: my_pet_care
      POSTGRES_DB: owner_pet_manager
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_pet_care -d owner_pet_manager"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
