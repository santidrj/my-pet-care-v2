$kind: http-request
description: OPM-FR-005. Assigns the path Owner as the Pet's sole Owner.
url: '{{baseUrl}}/owners/:ownerId/pets'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: ownerId
    value: '{{ownerId}}'
body:
  type: json
  content: |-
    {
      "name": "Nori",
      "species": "cat",
      "sex": "female"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      function persist(key, value) {
        if (value === undefined || value === null || value === '') {
          return;
        }
        pm.collectionVariables.set(key, String(value));
        pm.environment.set(key, String(value));
      }

      pm.test('HTTP status is 201', function () {
        pm.response.to.have.status(201);
      });
      if (pm.response.code !== 201) {
        return;
      }
      pm.test('response includes an id', function () {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a('string').and.not.empty;
        persist('petId', body.id);
      });
examples: './.resources/Create Pet.resources/examples'
order: 1000
