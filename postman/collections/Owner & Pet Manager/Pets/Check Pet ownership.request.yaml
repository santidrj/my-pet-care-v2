$kind: http-request
description: OPM-FR-010. Platform services only. Answerable for deactivated Owners and Pets.
url: '{{baseUrl}}/pets/:petId/owners/:ownerId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: petId
    value: '{{petId}}'
  - key: ownerId
    value: '{{ownerId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{platformAccessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
      if (pm.response.code !== 200) {
        return;
      }
      pm.test('ownership check returns isOwner', function () {
        pm.expect(pm.response.json()).to.have.property('isOwner');
        pm.expect(pm.response.json().isOwner).to.be.a('boolean');
      });
examples: './.resources/Check Pet ownership.resources/examples'
order: 7000
