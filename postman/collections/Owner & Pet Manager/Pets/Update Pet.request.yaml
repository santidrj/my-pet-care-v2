$kind: http-request
description: OPM-FR-007. Pet's Owner only.
url: '{{baseUrl}}/pets/:petId'
method: PATCH
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: petId
    value: '{{petId}}'
body:
  type: json
  content: |-
    {
      "name": "Nori"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
examples: './.resources/Update Pet.resources/examples'
order: 3000
