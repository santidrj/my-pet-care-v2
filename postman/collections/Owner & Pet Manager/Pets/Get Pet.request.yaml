$kind: http-request
description: OPM-FR-006. Pet's Owner or platform services. Other Owners use Get Pet Summary.
url: '{{baseUrl}}/pets/:petId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: petId
    value: '{{petId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
examples: './.resources/Get Pet.resources/examples'
order: 2000
