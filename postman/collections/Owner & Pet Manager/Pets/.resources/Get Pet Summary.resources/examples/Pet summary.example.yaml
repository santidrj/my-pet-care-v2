$kind: http-example
request:
  url: "{{baseUrl}}/pets/:petId/summary"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: "(Required) "
    - key: baseUrl
      value: "{{baseUrl}}"
      description: ""
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "91a18ab8-b802-3c5e-e20b-82ef76cd7875",
        "name": "string",
        "species": "string",
        "sex": "male",
        "breed": "string",
        "dateOfBirth": "2015-02-28",
        "photo": "string"
      }
order: 1000
