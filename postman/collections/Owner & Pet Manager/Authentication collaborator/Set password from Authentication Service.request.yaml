$kind: http-request
description: OPM-FR-015. Completed forgotten-password reset. Auth-only.
url: '{{baseUrl}}/owners/:ownerId/credentials/password'
method: PUT
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: ownerId
    value: '{{ownerId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{platformAccessToken}}'
body:
  type: json
  content: |-
    {
      "password": "correct horse battery staple"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
examples: './.resources/Set password from Authentication Service.resources/examples'
order: 3000
