$kind: http-request
description: |
  OPM-FR-013. Authentication Service only. Identifier is a username or email
  (same parsing rules as Auth).
url: '{{baseUrl}}/owners/credentials'
method: GET
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: identifier
    value: '{{ownerUsername}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{platformAccessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
      if (pm.response.code !== 200) {
        return;
      }
      pm.test('credentials omit the raw password', function () {
        const body = pm.response.json();
        pm.expect(body.ownerId).to.be.a('string').and.not.empty;
        pm.expect(body.passwordHash).to.be.a('string').and.not.empty;
        pm.expect(body).to.have.property('active');
        pm.expect(body).to.not.have.property('password');
      });
examples: './.resources/Get credentials by identifier.resources/examples'
order: 1000
