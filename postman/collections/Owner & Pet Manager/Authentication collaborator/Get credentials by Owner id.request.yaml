$kind: http-request
description: OPM-FR-014. Authentication Service only (refresh).
url: '{{baseUrl}}/owners/:ownerId/credentials'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: ownerId
    value: '{{ownerId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{platformAccessToken}}'
examples: './.resources/Get credentials by Owner id.resources/examples'
order: 2000
