$kind: http-example
request:
  url: "{{baseUrl}}/owners/credentials?identifier=<string>"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  queryParams:
    identifier: <string>
  pathVariables:
    baseUrl: "{{baseUrl}}"
  body:
    type: text
    content: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "string",
        "title": "string",
        "status": 6091,
        "detail": "string"
      }
order: 2000
