$kind: http-example
request:
  url: "{{baseUrl}}/owners/credentials?identifier=<string>"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  queryParams:
    identifier: <string>
  pathVariables:
    baseUrl: "{{baseUrl}}"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "ownerId": "ab3f6f7a-895e-79f1-44c9-a3b664ddf905",
        "passwordHash": "string",
        "active": true
      }
order: 1000
