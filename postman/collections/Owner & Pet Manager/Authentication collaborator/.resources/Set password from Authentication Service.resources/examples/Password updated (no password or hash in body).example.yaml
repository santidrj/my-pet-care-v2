$kind: http-example
request:
  url: "{{baseUrl}}/owners/:ownerId/credentials/password"
  method: PUT
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: ownerId
      value: <uuid>
      disabled: false
      description: "(Required) "
    - key: baseUrl
      value: "{{baseUrl}}"
      description: ""
  body:
    type: json
    content: |-
      {
        "password": "stringstring"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "ownerId": "caa46e2e-98e1-2369-574f-b44f700ddb85"
      }
order: 1000
