$kind: http-request
description: |
  OPM-FR-002. Another Owner does not receive email. Password and hash never
  returned.
url: '{{baseUrl}}/owners/:ownerId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: ownerId
    value: '{{ownerId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
examples: './.resources/Get Owner by id.resources/examples'
order: 3000
