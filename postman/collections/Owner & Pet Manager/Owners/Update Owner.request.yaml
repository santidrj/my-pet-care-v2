$kind: http-request
description: OPM-FR-003. Owning Owner only. Password change notifies Auth to revoke refresh tokens.
url: '{{baseUrl}}/owners/:ownerId'
method: PATCH
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: ownerId
    value: '{{ownerId}}'
body:
  type: json
  content: |-
    {
      "username": "ada_lovelace"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
examples: './.resources/Update Owner.resources/examples'
order: 4000
