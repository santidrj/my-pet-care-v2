$kind: http-example
request:
  url: "{{baseUrl}}/owners/:ownerId/pet-list-visibility"
  method: PUT
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: ownerId
      value: <uuid>
      disabled: false
      description: "(Required) "
    - key: baseUrl
      value: "{{baseUrl}}"
      description: ""
  body:
    type: json
    content: |-
      {
        "petListVisibility": "public"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "ownerId": "ae842c51-4e2b-49f3-981c-fcea1735f555",
        "petListVisibility": "public"
      }
order: 1000
