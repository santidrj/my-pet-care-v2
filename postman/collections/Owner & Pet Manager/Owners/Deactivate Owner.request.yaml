$kind: http-request
description: |
  OPM-FR-004. Soft Deactivation (not Hard delete). Community-owner gate;
  deactivates active Pets first.
url: '{{baseUrl}}/owners/:ownerId'
method: DELETE
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: ownerId
    value: '{{ownerId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 204', function () {
        pm.response.to.have.status(204);
      });
examples: './.resources/Deactivate Owner.resources/examples'
order: 5000
