$kind: http-request
description: OPM-FR-002 username lookup.
url: '{{baseUrl}}/owners'
method: GET
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: username
    value: '{{ownerUsername}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
examples: './.resources/Get Owner by username.resources/examples'
order: 2000
