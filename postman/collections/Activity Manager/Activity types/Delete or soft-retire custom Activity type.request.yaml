$kind: http-request
description: |
  AM-FR-004. `204` when no Activity references the type. `200` with the
  retired type when any Activity does, including when it is already
  soft-retired. Platform-default types are forbidden.
url: "{{baseUrl}}/activity-types/:activityTypeId"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: activityTypeId
    value: '{{activityTypeId}}'
    disabled: false
    description: "(Required) "
  - key: baseUrl
    value: "{{baseUrl}}"
    description: ""
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 204 or 200', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });
examples: ./.resources/Delete or soft-retire custom Activity type.resources/examples
order: 5000
