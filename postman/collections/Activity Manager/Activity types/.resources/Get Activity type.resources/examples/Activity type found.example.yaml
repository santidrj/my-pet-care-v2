$kind: http-example
request:
  url: "{{baseUrl}}/activity-types/:activityTypeId"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: activityTypeId
      value: <uuid>
      disabled: false
      description: "(Required) "
    - key: baseUrl
      value: "{{baseUrl}}"
      description: ""
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "22222222-2222-4222-8222-222222222222",
        "label": "Frisbee",
        "gpsCapable": false,
        "calorieFactor": 0.08,
        "scope": "owner",
        "softRetired": true
      }
order: 1000
