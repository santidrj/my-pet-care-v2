$kind: http-example
request:
  url: "{{baseUrl}}/activity-types"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    baseUrl: "{{baseUrl}}"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "items": [
          {
            "id": "11111111-1111-4111-8111-111111111111",
            "label": "Walk",
            "gpsCapable": true,
            "calorieFactor": 0.05,
            "scope": "platform",
            "softRetired": false
          }
        ]
      }
order: 1000
