$kind: http-example
name: Platform-default Activity type rename or delete.
request:
  url: "{{baseUrl}}/activity-types/:activityTypeId"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: activityTypeId
      value: <uuid>
      disabled: false
      description: "(Required) "
    - key: baseUrl
      value: "{{baseUrl}}"
      description: ""
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:forbidden",
        "title": "Forbidden",
        "status": 403,
        "detail": "You are not allowed to perform this operation."
      }
order: 4000
