$kind: http-example
name: Missing, invalid, or expired Bearer JWT.
request:
  url: "{{baseUrl}}/activity-types"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    baseUrl: "{{baseUrl}}"
  body:
    type: json
    content: |-
      {
        "label": "Frisbee",
        "gpsCapable": false,
        "calorieFactor": 0.08
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:unauthorized",
        "title": "Unauthorized",
        "status": 401,
        "detail": "Authentication is required to access this resource."
      }
order: 3000
