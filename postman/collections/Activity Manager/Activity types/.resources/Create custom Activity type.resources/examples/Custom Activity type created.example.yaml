$kind: http-example
request:
  url: "{{baseUrl}}/activity-types"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    baseUrl: "{{baseUrl}}"
  body:
    type: json
    content: |-
      {
        "label": "Frisbee",
        "gpsCapable": false,
        "calorieFactor": 0.08
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "22222222-2222-4222-8222-222222222222",
        "label": "Frisbee",
        "gpsCapable": false,
        "calorieFactor": 0.08,
        "scope": "owner",
        "softRetired": false
      }
order: 1000
