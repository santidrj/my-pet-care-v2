$kind: http-example
name: The request is invalid.
request:
  url: "{{baseUrl}}/activity-types"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    baseUrl: "{{baseUrl}}"
  body:
    type: json
    content: |-
      {
        "label": "Frisbee",
        "gpsCapable": false,
        "calorieFactor": 0.08
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:validation-failed",
        "title": "Bad Request",
        "status": 400,
        "detail": "The request is invalid."
      }
order: 2000
