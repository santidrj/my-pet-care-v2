$kind: http-request
description: |
  AM-FR-002. Creates an Owner-scoped custom Activity type. Platform
  defaults cannot be created here.
url: "{{baseUrl}}/activity-types"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  baseUrl: "{{baseUrl}}"
body:
  type: json
  content: |-
    {
      "label": "Frisbee",
      "gpsCapable": false,
      "calorieFactor": 0.08
    }
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      function persist(key, value) {
        if (value === undefined || value === null || value === '') {
          return;
        }
        pm.collectionVariables.set(key, String(value));
        pm.environment.set(key, String(value));
      }

      pm.test('HTTP status is 201', function () {
        pm.response.to.have.status(201);
      });
      if (pm.response.code !== 201) {
        return;
      }
      pm.test('response includes an id', function () {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a('string').and.not.empty;
        persist('activityTypeId', body.id);
      });
examples: ./.resources/Create custom Activity type.resources/examples
order: 2000
