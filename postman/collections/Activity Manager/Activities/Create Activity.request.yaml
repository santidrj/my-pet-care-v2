$kind: http-request
description: |
  AM-FR-005. Registers an Activity for a Pet the caller owns. A
  GPS-capable Activity type requires `route`. A `route` on a non-GPS
  type is `400`. A soft-retired type is `409` `conflict`. Calories burned
  are system-estimated. Fails closed when latest weight is missing or
  Pet Health or Owner & Pet Manager cannot be reached.
url: "{{baseUrl}}/pets/:petId/activities"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: petId
    value: '{{petId}}'
    disabled: false
    description: (Required) Pet id from Owner & Pet Manager.
  - key: baseUrl
    value: "{{baseUrl}}"
    description: ""
body:
  type: json
  content: |-
    {
      "activityTypeId": "{{activityTypeId}}",
      "timestamp": "2026-09-28T08:30:00.000Z",
      "durationMinutes": 30,
      "activityAmount": 2.4,
      "notes": "Morning loop",
      "route": {
        "points": [
          {
            "latitude": 41.39,
            "longitude": 2.17
          },
          {
            "latitude": 41.4,
            "longitude": 2.18
          }
        ]
      }
    }
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      function persist(key, value) {
        if (value === undefined || value === null || value === '') {
          return;
        }
        pm.collectionVariables.set(key, String(value));
        pm.environment.set(key, String(value));
      }

      pm.test('HTTP status is 201', function () {
        pm.response.to.have.status(201);
      });
      if (pm.response.code !== 201) {
        return;
      }
      pm.test('response includes an id', function () {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a('string').and.not.empty;
        persist('activityId', body.id);
      });
examples: ./.resources/Create Activity.resources/examples
order: 1000
