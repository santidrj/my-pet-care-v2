$kind: http-example
request:
  url: "{{baseUrl}}/activities/:activityId"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: activityId
      value: <uuid>
      disabled: false
      description: "(Required) "
    - key: baseUrl
      value: "{{baseUrl}}"
      description: ""
  body:
    type: json
    content: |-
      {
        "durationMinutes": 45,
        "notes": "Extended loop"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "33333333-3333-4333-8333-333333333333",
        "petId": "44444444-4444-4444-8444-444444444444",
        "activityTypeId": "11111111-1111-4111-8111-111111111111",
        "timestamp": "2026-09-28T08:30:00.000Z",
        "durationMinutes": 45,
        "caloriesBurned": 129,
        "calorieOverride": false,
        "notes": "Extended loop",
        "route": {
          "points": [
            {
              "latitude": 41.39,
              "longitude": 2.17
            },
            {
              "latitude": 41.4,
              "longitude": 2.18
            }
          ]
        }
      }
order: 1000
