$kind: http-example
name: |
  Soft-retired Activity type (`urn:my-pet-care:conflict`), deactivated
  Pet (`urn:my-pet-care:pet-deactivated`), or empty latest weight when
  a re-estimate is required (`urn:my-pet-care:latest-weight-missing`).
request:
  url: "{{baseUrl}}/activities/:activityId"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: activityId
      value: <uuid>
      disabled: false
      description: "(Required) "
    - key: baseUrl
      value: "{{baseUrl}}"
      description: ""
  body:
    type: json
    content: |-
      {
        "durationMinutes": 45,
        "notes": "Extended loop"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:conflict",
        "title": "Conflict",
        "status": 409,
        "detail": "The request conflicts with the current state of the resource."
      }
order: 5000
