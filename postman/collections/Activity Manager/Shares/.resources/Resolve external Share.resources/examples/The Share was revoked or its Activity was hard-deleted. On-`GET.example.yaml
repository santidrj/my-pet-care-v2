$kind: http-example
name: |
  The Share was revoked or its Activity was hard-deleted. On
  `GET /shares/external/{token}` this is also the response for an unknown token.
request:
  url: "{{baseUrl}}/shares/external/:token"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: token
      value: <string>
      disabled: false
      description: (Required) Secret capability token. Not the share id.
    - key: baseUrl
      value: "{{baseUrl}}"
      description: ""
  body:
    type: text
    content: ""
response:
  statusCode: 410
  statusText: Gone
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:share-unavailable",
        "title": "Gone",
        "status": 410,
        "detail": "This share is no longer available."
      }
order: 2000
