$kind: http-example
name: The caller owns the Pet and the Pet is deactivated.
request:
  url: "{{baseUrl}}/activities/:activityId/shares"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: activityId
      value: <uuid>
      disabled: false
      description: "(Required) "
    - key: baseUrl
      value: "{{baseUrl}}"
      description: ""
  body:
    type: json
    content: |-
      {
        "audience": "owner",
        "recipientOwnerId": "55555555-5555-4555-8555-555555555555"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:pet-deactivated",
        "title": "Conflict",
        "status": 409,
        "detail": "This Pet is deactivated."
      }
order: 5000
