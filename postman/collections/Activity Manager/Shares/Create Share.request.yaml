$kind: http-request
description: |
  AM-FR-010, AM-FR-011, AM-FR-012. One body names the audience. Each
  success creates a new Share, including a second Share to the same
  audience. An external Share returns `link` and `summary`. The Community
  itself and a Shared location are not audiences. Fails when the Pet is
  deactivated. A Forum or Group activity Share fails closed when the
  Community collaborator cannot be reached.
url: "{{baseUrl}}/activities/:activityId/shares"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: activityId
    value: '{{activityId}}'
    disabled: false
    description: "(Required) "
  - key: baseUrl
    value: "{{baseUrl}}"
    description: ""
body:
  type: json
  content: |-
    {
      "audience": "owner",
      "recipientOwnerId": "{{recipientOwnerId}}"
    }
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      function persist(key, value) {
        if (value === undefined || value === null || value === '') {
          return;
        }
        pm.collectionVariables.set(key, String(value));
        pm.environment.set(key, String(value));
      }

      pm.test('HTTP status is 201', function () {
        pm.response.to.have.status(201);
      });
      if (pm.response.code !== 201) {
        return;
      }
      pm.test('Share is created', function () {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a('string').and.not.empty;
        persist('shareId', body.id);
        if (typeof body.link === 'string' && body.link.length > 0) {
          persist('externalShareToken', body.link.split('/').filter(Boolean).pop());
        }
      });
examples: ./.resources/Create Share.resources/examples
order: 1000
