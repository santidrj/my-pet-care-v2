$kind: http-request
description: |
  AM-FR-012. Returns the Share snapshot frozen at share-create time.
  The caller is the recipient Owner, or an Owner with Belonging in the
  Community that contains the Forum or Group activity. The Pet's Owner
  does not use this route. A missing id or a caller who is not the
  audience is `404`. A revoked Share or a hard-deleted Activity is `410`.
url: "{{baseUrl}}/shares/:shareId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: shareId
    value: '{{shareId}}'
    disabled: false
    description: "(Required) "
  - key: baseUrl
    value: "{{baseUrl}}"
    description: ""
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
examples: ./.resources/Resolve Share.resources/examples
order: 2000
