$kind: http-example
name: |
  Owner & Pet Manager (`urn:my-pet-care:owner-pet-manager-unavailable`)
  or Pet Health (`urn:my-pet-care:pet-health-unavailable`) cannot be reached.
request:
  url: "{{baseUrl}}/activities/:activityId/calorie-override"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: activityId
      value: <uuid>
      disabled: false
      description: "(Required) "
    - key: baseUrl
      value: "{{baseUrl}}"
      description: ""
  body:
    type: text
    content: ""
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:owner-pet-manager-unavailable",
        "title": "Service Unavailable",
        "status": 503,
        "detail": "Owner & Pet Manager could not be reached."
      }
order: 6000
