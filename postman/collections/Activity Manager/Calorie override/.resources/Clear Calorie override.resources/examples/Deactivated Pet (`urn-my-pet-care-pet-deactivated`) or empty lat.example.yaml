$kind: http-example
name: |
  Deactivated Pet (`urn:my-pet-care:pet-deactivated`) or empty latest
  weight (`urn:my-pet-care:latest-weight-missing`).
request:
  url: "{{baseUrl}}/activities/:activityId/calorie-override"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: activityId
      value: <uuid>
      disabled: false
      description: "(Required) "
    - key: baseUrl
      value: "{{baseUrl}}"
      description: ""
  body:
    type: text
    content: ""
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:pet-deactivated",
        "title": "Conflict",
        "status": 409,
        "detail": "This Pet is deactivated."
      }
order: 4000
