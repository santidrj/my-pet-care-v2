$kind: http-request
description: Process liveness. Public. No Bearer JWT.
url: '{{baseUrl}}/health'
method: GET
headers:
  - key: Accept
    value: application/json
auth:
  type: noauth
pathVariables:
  baseUrl: "{{baseUrl}}"
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
      if (pm.response.code !== 200) {
        return;
      }
      pm.test('liveness body is ok', function () {
        pm.expect(pm.response.json()).to.eql({ status: 'ok' });
      });
examples: ./.resources/Liveness.resources/examples
order: 1000
