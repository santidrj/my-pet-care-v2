$kind: http-request
description: |
  AUTH-FR-005. Public. Sets a new password via a single-use reset token and
  revokes that Owner’s refresh tokens.
url: '{{baseUrl}}/auth/password-reset/complete'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "resetToken": "{{resetToken}}",
      "password": "correct horse battery staple"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 204', function () {
        pm.response.to.have.status(204);
      });
examples: './.resources/Complete password reset.resources/examples'
order: 5000
