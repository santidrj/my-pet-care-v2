$kind: http-request
description: |
  AUTH-FR-001. Public. Identifier is a username or email (same parsing
  rules as Owner & Pet Manager). Returns Owner access and refresh tokens.
url: '{{baseUrl}}/auth/login'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "identifier": "ada_lovelace",
      "password": "correct horse battery staple"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      function persist(key, value) {
        if (value === undefined || value === null || value === '') {
          return;
        }
        pm.collectionVariables.set(key, String(value));
        pm.environment.set(key, String(value));
      }

      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
      if (pm.response.code !== 200) {
        return;
      }
      pm.test('Owner session tokens are issued', function () {
        const body = pm.response.json();
        pm.expect(body.accessToken).to.be.a('string').and.not.empty;
        pm.expect(body.tokenType).to.eql('Bearer');
        pm.expect(body.refreshToken).to.be.a('string').and.not.empty;
        persist('ownerAccessToken', body.accessToken);
        persist('refreshToken', body.refreshToken);
      });
examples: './.resources/Login.resources/examples'
order: 1000
