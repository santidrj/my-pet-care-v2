$kind: http-example
request:
  url: "{{baseUrl}}/auth/refresh"
  method: POST
  headers:
    Accept: application/json
  pathVariables:
    baseUrl: "{{baseUrl}}"
  body:
    type: json
    content: |-
      {
        "refreshToken": "<string>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "string",
        "title": "string",
        "status": 3866,
        "detail": "string"
      }
order: 3000
