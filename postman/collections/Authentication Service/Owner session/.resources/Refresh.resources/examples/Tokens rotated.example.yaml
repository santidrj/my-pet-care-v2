$kind: http-example
request:
  url: '{{baseUrl}}/auth/refresh'
  method: POST
  headers:
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "refreshToken": "rt_example_refresh_token"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "accessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.owner",
        "tokenType": "Bearer",
        "expiresIn": 900,
        "refreshToken": "rt_example_rotated_refresh_token"
      }
order: 1000
