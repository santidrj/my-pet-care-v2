$kind: http-example
request:
  url: "{{baseUrl}}/auth/password-reset/complete"
  method: POST
  pathVariables:
    baseUrl: "{{baseUrl}}"
  body:
    type: json
    content: |-
      {
        "resetToken": "<string>",
        "password": "stringstring"
      }
response:
  statusCode: 204
  statusText: No Content
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
