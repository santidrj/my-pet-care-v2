$kind: http-request
description: |
  AUTH-FR-002. Public. Exchanges a current refresh token for a new access
  token and rotated refresh token.
url: '{{baseUrl}}/auth/refresh'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      function persist(key, value) {
        if (value === undefined || value === null || value === '') {
          return;
        }
        pm.collectionVariables.set(key, String(value));
        pm.environment.set(key, String(value));
      }

      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
      if (pm.response.code !== 200) {
        return;
      }
      pm.test('Owner session tokens are issued', function () {
        const body = pm.response.json();
        pm.expect(body.accessToken).to.be.a('string').and.not.empty;
        pm.expect(body.tokenType).to.eql('Bearer');
        pm.expect(body.refreshToken).to.be.a('string').and.not.empty;
        persist('ownerAccessToken', body.accessToken);
        persist('refreshToken', body.refreshToken);
      });
examples: './.resources/Refresh.resources/examples'
order: 2000
