$kind: http-request
description: AUTH-FR-004. Public. Starts a forgotten-password reset for an active Owner email.
url: '{{baseUrl}}/auth/password-reset/request'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "email": "ada@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 202', function () {
        pm.response.to.have.status(202);
      });
examples: './.resources/Request password reset.resources/examples'
order: 4000
