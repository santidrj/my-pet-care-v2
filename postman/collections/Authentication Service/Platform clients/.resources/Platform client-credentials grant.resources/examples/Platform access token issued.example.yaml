$kind: http-example
request:
  url: '{{baseUrl}}/oauth/token'
  method: POST
  headers:
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "grantType": "client_credentials",
        "serviceId": "owner-pet-manager",
        "secret": "platform-client-secret"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "accessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.platform",
        "tokenType": "Bearer",
        "expiresIn": 3600
      }
order: 1000
