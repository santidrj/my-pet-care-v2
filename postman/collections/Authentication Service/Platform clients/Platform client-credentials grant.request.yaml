$kind: http-request
description: |
  AUTH-FR-007 / ADR-0017. Public JSON body. Issues a platform-service
  access token for the authenticated client’s own service id only.
  `grantType` must be `client_credentials`.
url: '{{baseUrl}}/oauth/token'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "grantType": "client_credentials",
      "serviceId": "owner-pet-manager",
      "secret": "{{platformClientSecret}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      function persist(key, value) {
        if (value === undefined || value === null || value === '') {
          return;
        }
        pm.collectionVariables.set(key, String(value));
        pm.environment.set(key, String(value));
      }

      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
      if (pm.response.code !== 200) {
        return;
      }
      pm.test('platform access token is issued', function () {
        const body = pm.response.json();
        pm.expect(body.accessToken).to.be.a('string').and.not.empty;
        pm.expect(body.tokenType).to.eql('Bearer');
        pm.expect(body).to.not.have.property('refreshToken');
        persist('platformAccessToken', body.accessToken);
      });
examples: './.resources/Platform client-credentials grant.resources/examples'
order: 1000
