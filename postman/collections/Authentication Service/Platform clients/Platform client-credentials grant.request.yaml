$kind: http-request
description: |
  AUTH-FR-007 / ADR-0017. Public JSON body. Issues a platform-service
  access token for the authenticated client’s own service id only.
  `grantType` must be `client_credentials`.
url: '{{baseUrl}}/oauth/token'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "grantType": "client_credentials",
      "serviceId": "owner-pet-manager",
      "secret": "{{platformClientSecret}}"
    }
examples: './.resources/Platform client-credentials grant.resources/examples'
order: 1000
