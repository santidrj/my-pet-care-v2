$kind: http-request
description: PHS-FR-015. Allowed when the Pet is deactivated.
url: '{{baseUrl}}/medications/:medicationId'
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: medicationId
    value: '{{medicationId}}'
    disabled: false
    description: (Required) Medication id returned on create.
  - key: baseUrl
    value: '{{baseUrl}}'
    description: ''
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
examples: ./.resources/Get Medication.resources/examples
order: 3000
