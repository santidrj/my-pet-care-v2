$kind: http-request
description: |
  PHS-FR-015. `drugName`, `dosageInstructions`, and `startDate` are
  required. `endDate`, when sent, is on or after `startDate`. `vetVisitId`
  is optional; a Vet visit that is missing or belongs to another Pet is
  `404`.
url: '{{baseUrl}}/pets/:petId/medications'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: petId
    value: '{{petId}}'
    disabled: false
    description: (Required) Pet id from Owner & Pet Manager.
  - key: baseUrl
    value: '{{baseUrl}}'
    description: ''
body:
  type: json
  content: |-
    {
      "drugName": "Amoxicillin",
      "dosageInstructions": "250 mg twice a day with food",
      "startDate": "2026-09-15",
      "endDate": "2026-09-25"
    }
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      function persist(key, value) {
        if (value === undefined || value === null || value === '') {
          return;
        }
        pm.collectionVariables.set(key, String(value));
        pm.environment.set(key, String(value));
      }

      pm.test('HTTP status is 201', function () {
        pm.response.to.have.status(201);
      });
      if (pm.response.code !== 201) {
        return;
      }
      pm.test('response includes an id', function () {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a('string').and.not.empty;
        persist('medicationId', body.id);
      });
examples: ./.resources/Create Medication.resources/examples
order: 1000
