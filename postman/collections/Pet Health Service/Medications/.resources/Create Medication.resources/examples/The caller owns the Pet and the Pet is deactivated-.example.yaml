$kind: http-example
name: The caller owns the Pet and the Pet is deactivated.
request:
  url: '{{baseUrl}}/pets/:petId/medications'
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "drugName": "Amoxicillin",
        "dosageInstructions": "250 mg twice a day with food",
        "startDate": "2026-09-15",
        "endDate": "2026-09-25",
        "vetVisitId": "88888888-8888-4888-8888-888888888888"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:pet-deactivated",
        "title": "Conflict",
        "status": 409,
        "detail": "This Pet is deactivated."
      }
order: 6000
