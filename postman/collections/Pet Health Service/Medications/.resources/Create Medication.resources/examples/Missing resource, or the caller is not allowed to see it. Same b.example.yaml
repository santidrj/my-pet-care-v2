$kind: http-example
name: |
  Missing resource, or the caller is not allowed to see it. Same body
  either way (`urn:my-pet-care:resource-not-found`).
request:
  url: '{{baseUrl}}/pets/:petId/medications'
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "drugName": "Amoxicillin",
        "dosageInstructions": "250 mg twice a day with food",
        "startDate": "2026-09-15",
        "endDate": "2026-09-25",
        "vetVisitId": "88888888-8888-4888-8888-888888888888"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:resource-not-found",
        "title": "Not Found",
        "status": 404,
        "detail": "The requested resource was not found."
      }
order: 5000
