$kind: http-request
description: |
  PHS-FR-003. Optional `from` and `to` filter on the metric timestamp and
  include both ends. Results are timestamp descending. Allowed when the Pet
  is deactivated.
url: '{{baseUrl}}/pets/:petId/weight-metrics'
method: GET
headers:
  Accept: application/json
queryParams:
  - key: from
    value: '{{from}}'
    disabled: true
    description: Optional inclusive start of the timestamp range.
  - key: to
    value: '{{to}}'
    disabled: true
    description: Optional inclusive end of the timestamp range. When both are sent, must be greater than
      or equal to `from`.
pathVariables:
  - key: petId
    value: '{{petId}}'
    disabled: false
    description: (Required) Pet id from Owner & Pet Manager.
  - key: baseUrl
    value: '{{baseUrl}}'
    description: ''
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
examples: ./.resources/List weight Health metrics.resources/examples
order: 2000
