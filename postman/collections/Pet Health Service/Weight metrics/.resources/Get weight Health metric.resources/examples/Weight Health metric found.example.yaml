$kind: http-example
request:
  url: '{{baseUrl}}/weight-metrics/:metricId'
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: metricId
      value: <uuid>
      disabled: false
      description: (Required) Weight Health metric id returned on record.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: text
    content: ''
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "55555555-5555-4555-8555-555555555555",
        "petId": "44444444-4444-4444-8444-444444444444",
        "weightKg": 12.4,
        "timestamp": "2026-09-28T07:45:00.000Z"
      }
order: 1000
