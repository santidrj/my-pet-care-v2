$kind: http-example
request:
  url: '{{baseUrl}}/pets/:petId/weight-metrics'
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "weightKg": 12.4,
        "timestamp": "2026-09-28T07:45:00.000Z"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "55555555-5555-4555-8555-555555555555",
        "petId": "44444444-4444-4444-8444-444444444444",
        "weightKg": 12.4,
        "timestamp": "2026-09-28T07:45:00.000Z"
      }
order: 1000
