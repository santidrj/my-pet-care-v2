$kind: http-example
name: The caller owns the Pet and the Pet is deactivated.
request:
  url: '{{baseUrl}}/pets/:petId/weight-metrics'
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "weightKg": 12.4,
        "timestamp": "2026-09-28T07:45:00.000Z"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:pet-deactivated",
        "title": "Conflict",
        "status": 409,
        "detail": "This Pet is deactivated."
      }
order: 6000
