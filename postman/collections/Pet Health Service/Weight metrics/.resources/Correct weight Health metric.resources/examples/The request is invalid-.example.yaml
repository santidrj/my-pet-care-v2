$kind: http-example
name: The request is invalid.
request:
  url: '{{baseUrl}}/weight-metrics/:metricId'
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: metricId
      value: <uuid>
      disabled: false
      description: (Required) Weight Health metric id returned on record.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "weightKg": 12.2
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:validation-failed",
        "title": "Bad Request",
        "status": 400,
        "detail": "The request is invalid."
      }
order: 2000
