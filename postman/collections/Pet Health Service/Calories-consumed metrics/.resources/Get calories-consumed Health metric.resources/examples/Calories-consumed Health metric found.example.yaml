$kind: http-example
request:
  url: '{{baseUrl}}/calories-consumed-metrics/:mealId'
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: mealId
      value: <uuid>
      disabled: false
      description: (Required) Meal id returned on create. Also the id of its calories-consumed Health
        metric.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: text
    content: ''
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "66666666-6666-4666-8666-666666666666",
        "petId": "44444444-4444-4444-8444-444444444444",
        "kilocalories": 320,
        "timestamp": "2026-09-28T07:30:00.000Z"
      }
order: 1000
