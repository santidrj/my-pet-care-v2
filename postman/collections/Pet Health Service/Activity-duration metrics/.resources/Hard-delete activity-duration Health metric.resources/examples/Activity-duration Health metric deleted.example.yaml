$kind: http-example
request:
  url: '{{baseUrl}}/activity-duration-metrics/:activityId'
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
  pathVariables:
    - key: activityId
      value: <uuid>
      disabled: false
      description: (Required) Activity id from Activity Manager. Also the id of its activity-duration
        Health metric.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: text
    content: ''
response:
  statusCode: 204
  statusText: No Content
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ''
order: 1000
