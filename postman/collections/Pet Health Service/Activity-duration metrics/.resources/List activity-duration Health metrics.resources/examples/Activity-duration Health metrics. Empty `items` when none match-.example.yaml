$kind: http-example
name: Activity-duration Health metrics. Empty `items` when none match.
request:
  url: '{{baseUrl}}/pets/:petId/activity-duration-metrics?from=2026-09-28T00:00:00.000Z&to=2026-09-28T23:59:59.999Z'
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  queryParams:
    from: '2026-09-28T00:00:00.000Z'
    to: '2026-09-28T23:59:59.999Z'
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: text
    content: ''
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "items": [
          {
            "id": "33333333-3333-4333-8333-333333333333",
            "petId": "44444444-4444-4444-8444-444444444444",
            "durationMinutes": 30,
            "timestamp": "2026-09-28T08:30:00.000Z"
          }
        ]
      }
order: 1000
