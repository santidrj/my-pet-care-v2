$kind: http-example
name: Owner & Pet Manager cannot be reached.
request:
  url: '{{baseUrl}}/pets/:petId/activity-duration-metrics?from=2026-09-28T00:00:00.000Z&to=2026-09-28T23:59:59.999Z'
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  queryParams:
    from: '2026-09-28T00:00:00.000Z'
    to: '2026-09-28T23:59:59.999Z'
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: text
    content: ''
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:owner-pet-manager-unavailable",
        "title": "Service Unavailable",
        "status": 503,
        "detail": "Owner & Pet Manager could not be reached."
      }
order: 6000
