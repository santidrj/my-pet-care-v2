$kind: http-example
name: Vet visits. Empty `items` when none match.
request:
  url: '{{baseUrl}}/pets/:petId/vet-visits?from=2026-09-28T00:00:00.000Z&to=2026-09-28T23:59:59.999Z'
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  queryParams:
    from: '2026-09-28T00:00:00.000Z'
    to: '2026-09-28T23:59:59.999Z'
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: text
    content: ''
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "items": [
          {
            "id": "88888888-8888-4888-8888-888888888888",
            "petId": "44444444-4444-4444-8444-444444444444",
            "visitedAt": "2026-09-15T10:00:00.000Z",
            "clinicName": "Clínica Veterinària Gràcia",
            "reason": "Annual check-up and vaccination"
          }
        ]
      }
order: 1000
