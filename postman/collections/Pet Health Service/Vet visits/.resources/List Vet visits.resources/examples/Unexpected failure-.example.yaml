$kind: http-example
name: Unexpected failure.
request:
  url: '{{baseUrl}}/pets/:petId/vet-visits?from=2026-09-28T00:00:00.000Z&to=2026-09-28T23:59:59.999Z'
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  queryParams:
    from: '2026-09-28T00:00:00.000Z'
    to: '2026-09-28T23:59:59.999Z'
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: text
    content: ''
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:internal-error",
        "title": "Internal Server Error",
        "status": 500,
        "detail": "The service failed to handle this request."
      }
order: 7000
