$kind: http-example
request:
  url: '{{baseUrl}}/vet-visits/:vetVisitId'
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: vetVisitId
      value: <uuid>
      disabled: false
      description: (Required) Vet visit id returned on create.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: text
    content: ''
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "88888888-8888-4888-8888-888888888888",
        "petId": "44444444-4444-4444-8444-444444444444",
        "visitedAt": "2026-09-15T10:00:00.000Z",
        "clinicName": "Clínica Veterinària Gràcia",
        "reason": "Annual check-up and vaccination"
      }
order: 1000
