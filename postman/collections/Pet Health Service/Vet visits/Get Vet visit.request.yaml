$kind: http-request
description: PHS-FR-014. Allowed when the Pet is deactivated.
url: '{{baseUrl}}/vet-visits/:vetVisitId'
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: vetVisitId
    value: '{{vetVisitId}}'
    disabled: false
    description: (Required) Vet visit id returned on create.
  - key: baseUrl
    value: '{{baseUrl}}'
    description: ''
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
examples: ./.resources/Get Vet visit.resources/examples
order: 3000
