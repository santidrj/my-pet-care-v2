$kind: http-example
name: |
  Missing resource, or the caller is not allowed to see it. Same body
  either way (`urn:my-pet-care:resource-not-found`).
request:
  url: '{{baseUrl}}/pets/:petId/kilocalories-eaten?from=2026-09-28T00:00:00.000Z&to=2026-09-28T23:59:59.999Z'
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  queryParams:
    from: '2026-09-28T00:00:00.000Z'
    to: '2026-09-28T23:59:59.999Z'
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: text
    content: ''
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:resource-not-found",
        "title": "Not Found",
        "status": 404,
        "detail": "The requested resource was not found."
      }
order: 5000
