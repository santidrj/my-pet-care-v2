$kind: http-example
request:
  url: '{{baseUrl}}/pets/:petId/meals'
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "foodName": "Chicken and rice kibble",
        "kilocalories": 320,
        "timestamp": "2026-09-28T07:30:00.000Z",
        "brand": "Acme Pet Foods",
        "labels": [
          "dry",
          "breakfast"
        ],
        "notes": "Ate everything"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "66666666-6666-4666-8666-666666666666",
        "petId": "44444444-4444-4444-8444-444444444444",
        "foodName": "Chicken and rice kibble",
        "kilocalories": 320,
        "timestamp": "2026-09-28T07:30:00.000Z",
        "brand": "Acme Pet Foods",
        "labels": [
          "dry",
          "breakfast"
        ],
        "notes": "Ate everything"
      }
order: 1000
