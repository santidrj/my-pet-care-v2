$kind: http-example
name: The request is invalid.
request:
  url: '{{baseUrl}}/pets/:petId/meals'
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "foodName": "Chicken and rice kibble",
        "kilocalories": 320,
        "timestamp": "2026-09-28T07:30:00.000Z",
        "brand": "Acme Pet Foods",
        "labels": [
          "dry",
          "breakfast"
        ],
        "notes": "Ate everything"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:validation-failed",
        "title": "Bad Request",
        "status": 400,
        "detail": "The request is invalid."
      }
order: 2000
