$kind: http-example
name: |
  Missing resource, or the caller is not allowed to see it. Same body
  either way (`urn:my-pet-care:resource-not-found`).
request:
  url: '{{baseUrl}}/meals/:mealId'
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: mealId
      value: <uuid>
      disabled: false
      description: (Required) Meal id returned on create. Also the id of its calories-consumed Health
        metric.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "kilocalories": 280,
        "notes": "Left a few pieces"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:resource-not-found",
        "title": "Not Found",
        "status": 404,
        "detail": "The requested resource was not found."
      }
order: 5000
