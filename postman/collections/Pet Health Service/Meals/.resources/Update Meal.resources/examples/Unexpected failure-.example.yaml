$kind: http-example
name: Unexpected failure.
request:
  url: '{{baseUrl}}/meals/:mealId'
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: mealId
      value: <uuid>
      disabled: false
      description: (Required) Meal id returned on create. Also the id of its calories-consumed Health
        metric.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "kilocalories": 280,
        "notes": "Left a few pieces"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:internal-error",
        "title": "Internal Server Error",
        "status": 500,
        "detail": "The service failed to handle this request."
      }
order: 8000
