$kind: http-example
name: |
  The kind of caller can never perform this operation: a platform service
  on an Owner route, a platform service other than Activity Manager, or an
  Owner on an Activity Manager route.
request:
  url: '{{baseUrl}}/meals/:mealId'
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: mealId
      value: <uuid>
      disabled: false
      description: (Required) Meal id returned on create. Also the id of its calories-consumed Health
        metric.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "kilocalories": 280,
        "notes": "Left a few pieces"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:forbidden",
        "title": "Forbidden",
        "status": 403,
        "detail": "You are not allowed to perform this operation."
      }
order: 4000
