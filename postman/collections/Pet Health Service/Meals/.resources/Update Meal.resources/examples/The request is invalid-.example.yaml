$kind: http-example
name: The request is invalid.
request:
  url: '{{baseUrl}}/meals/:mealId'
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: mealId
      value: <uuid>
      disabled: false
      description: (Required) Meal id returned on create. Also the id of its calories-consumed Health
        metric.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "kilocalories": 280,
        "notes": "Left a few pieces"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:validation-failed",
        "title": "Bad Request",
        "status": 400,
        "detail": "The request is invalid."
      }
order: 2000
