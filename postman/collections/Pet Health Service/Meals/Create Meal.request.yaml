$kind: http-request
description: |
  PHS-FR-007. Registers a Meal and its calories-consumed Health metric
  (same kilocalories and timestamp, id equal to the Meal id). `brand`,
  `labels`, and `notes` are optional.
url: '{{baseUrl}}/pets/:petId/meals'
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: petId
    value: '{{petId}}'
    disabled: false
    description: (Required) Pet id from Owner & Pet Manager.
  - key: baseUrl
    value: '{{baseUrl}}'
    description: ''
body:
  type: json
  content: |-
    {
      "foodName": "Chicken and rice kibble",
      "kilocalories": 320,
      "timestamp": "2026-09-28T07:30:00.000Z",
      "brand": "Acme Pet Foods",
      "labels": [
        "dry",
        "breakfast"
      ],
      "notes": "Ate everything"
    }
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      function persist(key, value) {
        if (value === undefined || value === null || value === '') {
          return;
        }
        pm.collectionVariables.set(key, String(value));
        pm.environment.set(key, String(value));
      }

      pm.test('HTTP status is 201', function () {
        pm.response.to.have.status(201);
      });
      if (pm.response.code !== 201) {
        return;
      }
      pm.test('response includes an id', function () {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a('string').and.not.empty;
        persist('mealId', body.id);
      });
examples: ./.resources/Create Meal.resources/examples
order: 1000
