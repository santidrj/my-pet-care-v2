$kind: http-example
name: Override cleared. Body is the Health profile.
request:
  url: '{{baseUrl}}/pets/:petId/health-profile/recommended-daily-kilocalories-override'
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: text
    content: ''
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "petId": "44444444-4444-4444-8444-444444444444",
        "latestWeightKg": 12.4,
        "recommendedDailyKilocalories": 740,
        "recommendedDailyKilocaloriesOverridden": false
      }
order: 1000
