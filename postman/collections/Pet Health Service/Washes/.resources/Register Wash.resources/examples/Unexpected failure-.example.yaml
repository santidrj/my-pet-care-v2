$kind: http-example
name: Unexpected failure.
request:
  url: '{{baseUrl}}/pets/:petId/washes'
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "timestamp": "2026-10-01T17:00:00.000Z",
        "notes": "Oatmeal shampoo"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:internal-error",
        "title": "Internal Server Error",
        "status": 500,
        "detail": "The service failed to handle this request."
      }
order: 8000
