$kind: http-example
request:
  url: '{{baseUrl}}/washes/:washId'
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
  pathVariables:
    - key: washId
      value: <uuid>
      disabled: false
      description: (Required) Wash id returned on register.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: text
    content: ''
response:
  statusCode: 204
  statusText: No Content
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ''
order: 1000
