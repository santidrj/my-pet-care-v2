$kind: http-example
name: The caller owns the Pet and the Pet is deactivated.
request:
  url: '{{baseUrl}}/washes/:washId'
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: washId
      value: <uuid>
      disabled: false
      description: (Required) Wash id returned on register.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "notes": null
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:pet-deactivated",
        "title": "Conflict",
        "status": 409,
        "detail": "This Pet is deactivated."
      }
order: 6000
