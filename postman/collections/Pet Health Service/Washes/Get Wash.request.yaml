$kind: http-request
description: PHS-FR-011. Allowed when the Pet is deactivated.
url: '{{baseUrl}}/washes/:washId'
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: washId
    value: '{{washId}}'
    disabled: false
    description: (Required) Wash id returned on register.
  - key: baseUrl
    value: '{{baseUrl}}'
    description: ''
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
examples: ./.resources/Get Wash.resources/examples
order: 3000
