$kind: http-example
name: |
  A Wash schedule already exists (`urn:my-pet-care:conflict`), or the Pet
  is deactivated (`urn:my-pet-care:pet-deactivated`).
request:
  url: '{{baseUrl}}/pets/:petId/wash-schedule'
  method: PUT
  headers:
    - key: Authorization
      value: Bearer <token>
      description: 'Added as a part of security scheme: bearer'
    - key: Accept
      value: application/json
  pathVariables:
    - key: petId
      value: <uuid>
      disabled: false
      description: (Required) Pet id from Owner & Pet Manager.
    - key: baseUrl
      value: '{{baseUrl}}'
      description: ''
  body:
    type: json
    content: |-
      {
        "startDate": "2026-10-01",
        "intervalDays": 14
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "type": "urn:my-pet-care:conflict",
        "title": "Conflict",
        "status": 409,
        "detail": "The request conflicts with the current state of the resource."
      }
order: 6000
