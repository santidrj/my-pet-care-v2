$kind: http-request
description: PHS-FR-010. No schedule is `404`. Allowed when the Pet is deactivated.
url: '{{baseUrl}}/pets/:petId/wash-schedule'
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: petId
    value: '{{petId}}'
    disabled: false
    description: (Required) Pet id from Owner & Pet Manager.
  - key: baseUrl
    value: '{{baseUrl}}'
    description: ''
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP status is 200', function () {
        pm.response.to.have.status(200);
      });
examples: ./.resources/Get Wash schedule.resources/examples
order: 2000
