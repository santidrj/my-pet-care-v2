openapi: 3.1.0
info:
  title: Activity Manager
  version: 0.1.0
  description: |
    REST API for the Activity Manager service (ADR-0004).

    Behavioral requirements: `docs/requirements/activity-manager.md`.
    HTTP route map: `docs/requirements/activity-manager-api.md`.

    A GPS Activity is an Activity with a `route`. Calorie override is its own
    sub-resource. External Share resolve is a capability URL with no JWT
    (ADR-0019). Errors use RFC 9457 Problem Details (ADR-0010, ADR-0014).
    At runtime the error Content-Type is `application/problem+json`; this
    OpenAPI file documents those bodies under `application/json` so Postman
    lint accepts the media type.
servers:
  - url: '{baseUrl}'
    description: Local or deployed Activity Manager base URL
    variables:
      baseUrl:
        default: http://localhost:3003
tags:
  - name: Health
    description: Process liveness (not an AM-FR)
  - name: Activity types
    description: Platform-default and Owner-scoped custom Activity types
  - name: Activities
    description: Activities registered for a Pet, including GPS Activities
  - name: Calorie override
    description: Owner override of Calories burned on an Activity
  - name: Shares
    description: In-platform and external Shares of one Activity
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness
      description: Public process liveness. No Bearer JWT. Not an AM-FR.
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
  /activity-types:
    get:
      tags: [Activity types]
      operationId: listActivityTypes
      summary: List Activity types
      description: |
        AM-FR-001. Pickable catalog for the Owner in the JWT: platform defaults
        plus that Owner's active custom types. Soft-retired types are omitted.
      responses:
        '200':
          description: Pickable Activity types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityTypeList'
              example:
                items:
                  - id: 11111111-1111-4111-8111-111111111111
                    label: Walk
                    gpsCapable: true
                    calorieFactor: 0.05
                    scope: platform
                    softRetired: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Activity types]
      operationId: createActivityType
      summary: Create custom Activity type
      description: |
        AM-FR-002. Creates an Owner-scoped custom Activity type. Platform
        defaults cannot be created here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityTypeRequest'
            example:
              label: Frisbee
              gpsCapable: false
              calorieFactor: 0.08
      responses:
        '201':
          description: Custom Activity type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityType'
              example:
                id: 22222222-2222-4222-8222-222222222222
                label: Frisbee
                gpsCapable: false
                calorieFactor: 0.08
                scope: owner
                softRetired: false
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /activity-types/{activityTypeId}:
    parameters:
      - $ref: '#/components/parameters/ActivityTypeId'
    get:
      tags: [Activity types]
      operationId: getActivityType
      summary: Get Activity type
      description: |
        AM-FR-001. Resolves a platform-default or this Owner's custom type,
        including a soft-retired type.
      responses:
        '200':
          description: Activity type found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityType'
              example:
                id: 22222222-2222-4222-8222-222222222222
                label: Frisbee
                gpsCapable: false
                calorieFactor: 0.08
                scope: owner
                softRetired: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Activity types]
      operationId: renameActivityType
      summary: Rename custom Activity type
      description: |
        AM-FR-003. Changes `label` only. `gpsCapable` and `calorieFactor` are
        immutable. Platform-default types are forbidden. Soft-retired types conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameActivityTypeRequest'
            example:
              label: Park frisbee
      responses:
        '200':
          description: Activity type renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityType'
              example:
                id: 22222222-2222-4222-8222-222222222222
                label: Park frisbee
                gpsCapable: false
                calorieFactor: 0.08
                scope: owner
                softRetired: false
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Activity types]
      operationId: deleteActivityType
      summary: Delete or soft-retire custom Activity type
      description: |
        AM-FR-004. `204` when no Activity references the type. `200` with the
        retired type when any Activity does, including when it is already
        soft-retired. Platform-default types are forbidden.
      responses:
        '200':
          description: Activity type soft-retired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityType'
              example:
                id: 22222222-2222-4222-8222-222222222222
                label: Frisbee
                gpsCapable: false
                calorieFactor: 0.08
                scope: owner
                softRetired: true
        '204':
          description: Activity type hard-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /pets/{petId}/activities:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags: [Activities]
      operationId: createActivity
      summary: Create Activity
      description: |
        AM-FR-005. Registers an Activity for a Pet the caller owns. A
        GPS-capable Activity type requires `route`. A `route` on a non-GPS
        type is `400`. A soft-retired type is `409` `conflict`. Calories burned
        are system-estimated. Fails closed when latest weight is missing or
        Pet Health or Owner & Pet Manager cannot be reached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityRequest'
            example:
              activityTypeId: 11111111-1111-4111-8111-111111111111
              timestamp: '2026-09-28T08:30:00.000Z'
              durationMinutes: 30
              activityAmount: 2.4
              notes: Morning loop
              route:
                points:
                  - latitude: 41.39
                    longitude: 2.17
                  - latitude: 41.4
                    longitude: 2.18
      responses:
        '201':
          description: Activity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
              example:
                id: 33333333-3333-4333-8333-333333333333
                petId: 44444444-4444-4444-8444-444444444444
                activityTypeId: 11111111-1111-4111-8111-111111111111
                timestamp: '2026-09-28T08:30:00.000Z'
                durationMinutes: 30
                activityAmount: 2.4
                caloriesBurned: 86
                calorieOverride: false
                notes: Morning loop
                route:
                  points:
                    - latitude: 41.39
                      longitude: 2.17
                    - latitude: 41.4
                      longitude: 2.18
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: |
            Soft-retired Activity type (`urn:my-pet-care:conflict`), deactivated
            Pet (`urn:my-pet-care:pet-deactivated`), or empty latest weight
            (`urn:my-pet-care:latest-weight-missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                softRetiredType:
                  summary: Activity type is soft-retired
                  value:
                    type: urn:my-pet-care:conflict
                    title: Conflict
                    status: 409
                    detail: The request conflicts with the current state of the resource.
                petDeactivated:
                  summary: Pet is deactivated
                  value:
                    type: urn:my-pet-care:pet-deactivated
                    title: Conflict
                    status: 409
                    detail: This Pet is deactivated.
                latestWeightMissing:
                  summary: Latest weight is empty
                  value:
                    type: urn:my-pet-care:latest-weight-missing
                    title: Conflict
                    status: 409
                    detail: This Pet has no latest weight.
        '503':
          description: |
            Owner & Pet Manager (`urn:my-pet-care:owner-pet-manager-unavailable`)
            or Pet Health (`urn:my-pet-care:pet-health-unavailable`) cannot be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                ownerPetManager:
                  summary: Owner & Pet Manager cannot be reached
                  value:
                    type: urn:my-pet-care:owner-pet-manager-unavailable
                    title: Service Unavailable
                    status: 503
                    detail: Owner & Pet Manager could not be reached.
                petHealth:
                  summary: Pet Health cannot be reached
                  value:
                    type: urn:my-pet-care:pet-health-unavailable
                    title: Service Unavailable
                    status: 503
                    detail: Pet Health Service could not be reached.
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Activities]
      operationId: listActivities
      summary: List Activities
      description: |
        AM-FR-006. `from` and `to` are required ISO-8601 instants. The filter
        uses the Activity timestamp and includes both ends. Results are
        timestamp descending. Allowed when the Pet is deactivated.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Activities in the range. Empty `items` when none match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
              example:
                items:
                  - id: 33333333-3333-4333-8333-333333333333
                    petId: 44444444-4444-4444-8444-444444444444
                    activityTypeId: 11111111-1111-4111-8111-111111111111
                    timestamp: '2026-09-28T08:30:00.000Z'
                    durationMinutes: 30
                    caloriesBurned: 86
                    calorieOverride: false
                    route:
                      points:
                        - latitude: 41.39
                          longitude: 2.17
                        - latitude: 41.4
                          longitude: 2.18
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /activities/{activityId}:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    get:
      tags: [Activities]
      operationId: getActivity
      summary: Get Activity
      description: |
        AM-FR-006. GPS Activities include `route`. Allowed when the Pet is deactivated.
      responses:
        '200':
          description: Activity found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
              example:
                id: 33333333-3333-4333-8333-333333333333
                petId: 44444444-4444-4444-8444-444444444444
                activityTypeId: 11111111-1111-4111-8111-111111111111
                timestamp: '2026-09-28T08:30:00.000Z'
                durationMinutes: 30
                caloriesBurned: 86
                calorieOverride: false
                route:
                  points:
                    - latitude: 41.39
                      longitude: 2.17
                    - latitude: 41.4
                      longitude: 2.18
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Activities]
      operationId: updateActivity
      summary: Update Activity
      description: |
        AM-FR-007. Partial update. Does not set or clear a Calorie override.
        Changing to a GPS-capable type requires `route` in this request.
        A `route` when the resulting type is not GPS-capable is `400`.
        Re-estimate runs when estimate inputs change and `calorieOverride` is false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivityRequest'
            example:
              durationMinutes: 45
              notes: Extended loop
      responses:
        '200':
          description: Activity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
              example:
                id: 33333333-3333-4333-8333-333333333333
                petId: 44444444-4444-4444-8444-444444444444
                activityTypeId: 11111111-1111-4111-8111-111111111111
                timestamp: '2026-09-28T08:30:00.000Z'
                durationMinutes: 45
                caloriesBurned: 129
                calorieOverride: false
                notes: Extended loop
                route:
                  points:
                    - latitude: 41.39
                      longitude: 2.17
                    - latitude: 41.4
                      longitude: 2.18
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: |
            Soft-retired Activity type (`urn:my-pet-care:conflict`), deactivated
            Pet (`urn:my-pet-care:pet-deactivated`), or empty latest weight when
            a re-estimate is required (`urn:my-pet-care:latest-weight-missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                softRetiredType:
                  summary: Activity type is soft-retired
                  value:
                    type: urn:my-pet-care:conflict
                    title: Conflict
                    status: 409
                    detail: The request conflicts with the current state of the resource.
                petDeactivated:
                  summary: Pet is deactivated
                  value:
                    type: urn:my-pet-care:pet-deactivated
                    title: Conflict
                    status: 409
                    detail: This Pet is deactivated.
                latestWeightMissing:
                  summary: Latest weight is empty
                  value:
                    type: urn:my-pet-care:latest-weight-missing
                    title: Conflict
                    status: 409
                    detail: This Pet has no latest weight.
        '503':
          description: |
            Owner & Pet Manager (`urn:my-pet-care:owner-pet-manager-unavailable`)
            or Pet Health (`urn:my-pet-care:pet-health-unavailable`) cannot be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                ownerPetManager:
                  summary: Owner & Pet Manager cannot be reached
                  value:
                    type: urn:my-pet-care:owner-pet-manager-unavailable
                    title: Service Unavailable
                    status: 503
                    detail: Owner & Pet Manager could not be reached.
                petHealth:
                  summary: Pet Health cannot be reached
                  value:
                    type: urn:my-pet-care:pet-health-unavailable
                    title: Service Unavailable
                    status: 503
                    detail: Pet Health Service could not be reached.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Activities]
      operationId: deleteActivity
      summary: Hard-delete Activity
      description: |
        AM-FR-009. Permanent. Allowed when the Pet is deactivated. Shares of
        this Activity then resolve as no longer available. Fails closed when
        the activity-duration sync cannot be completed.
      responses:
        '204':
          description: Activity hard-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          description: |
            Owner & Pet Manager (`urn:my-pet-care:owner-pet-manager-unavailable`)
            or Pet Health (`urn:my-pet-care:pet-health-unavailable`) cannot be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                ownerPetManager:
                  summary: Owner & Pet Manager cannot be reached
                  value:
                    type: urn:my-pet-care:owner-pet-manager-unavailable
                    title: Service Unavailable
                    status: 503
                    detail: Owner & Pet Manager could not be reached.
                petHealth:
                  summary: Pet Health cannot be reached
                  value:
                    type: urn:my-pet-care:pet-health-unavailable
                    title: Service Unavailable
                    status: 503
                    detail: Pet Health Service could not be reached.
        '500':
          $ref: '#/components/responses/InternalError'
  /activities/{activityId}/calorie-override:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    put:
      tags: [Calorie override]
      operationId: setCalorieOverride
      summary: Set Calorie override
      description: |
        AM-FR-008. Sets an explicit Calories burned value. Later Activity
        updates do not replace it. Response is the Activity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCalorieOverrideRequest'
            example:
              caloriesBurned: 120
      responses:
        '200':
          description: Override set. Body is the Activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
              example:
                id: 33333333-3333-4333-8333-333333333333
                petId: 44444444-4444-4444-8444-444444444444
                activityTypeId: 11111111-1111-4111-8111-111111111111
                timestamp: '2026-09-28T08:30:00.000Z'
                durationMinutes: 30
                caloriesBurned: 120
                calorieOverride: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/PetDeactivated'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Calorie override]
      operationId: clearCalorieOverride
      summary: Clear Calorie override
      description: |
        AM-FR-008. Clears the override and re-estimates from duration, latest
        weight, and the Activity type calorie factor. Response is the Activity.
        Fails closed when latest weight is empty or Pet Health cannot be reached.
      responses:
        '200':
          description: Override cleared and Calories burned re-estimated. Body is the Activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
              example:
                id: 33333333-3333-4333-8333-333333333333
                petId: 44444444-4444-4444-8444-444444444444
                activityTypeId: 11111111-1111-4111-8111-111111111111
                timestamp: '2026-09-28T08:30:00.000Z'
                durationMinutes: 30
                caloriesBurned: 86
                calorieOverride: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: |
            Deactivated Pet (`urn:my-pet-care:pet-deactivated`) or empty latest
            weight (`urn:my-pet-care:latest-weight-missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                petDeactivated:
                  summary: Pet is deactivated
                  value:
                    type: urn:my-pet-care:pet-deactivated
                    title: Conflict
                    status: 409
                    detail: This Pet is deactivated.
                latestWeightMissing:
                  summary: Latest weight is empty
                  value:
                    type: urn:my-pet-care:latest-weight-missing
                    title: Conflict
                    status: 409
                    detail: This Pet has no latest weight.
        '503':
          description: |
            Owner & Pet Manager (`urn:my-pet-care:owner-pet-manager-unavailable`)
            or Pet Health (`urn:my-pet-care:pet-health-unavailable`) cannot be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                ownerPetManager:
                  summary: Owner & Pet Manager cannot be reached
                  value:
                    type: urn:my-pet-care:owner-pet-manager-unavailable
                    title: Service Unavailable
                    status: 503
                    detail: Owner & Pet Manager could not be reached.
                petHealth:
                  summary: Pet Health cannot be reached
                  value:
                    type: urn:my-pet-care:pet-health-unavailable
                    title: Service Unavailable
                    status: 503
                    detail: Pet Health Service could not be reached.
        '500':
          $ref: '#/components/responses/InternalError'
  /activities/{activityId}/shares:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    post:
      tags: [Shares]
      operationId: createShare
      summary: Create Share
      description: |
        AM-FR-010, AM-FR-011, AM-FR-012. One body names the audience. Each
        success creates a new Share, including a second Share to the same
        audience. An external Share returns `link` and `summary`. The Community
        itself and a Shared location are not audiences. Fails when the Pet is
        deactivated. A Forum or Group activity Share fails closed when the
        Community collaborator cannot be reached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareRequest'
            examples:
              owner:
                summary: Recipient Owner
                value:
                  audience: owner
                  recipientOwnerId: 55555555-5555-4555-8555-555555555555
              forum:
                summary: Forum
                value:
                  audience: forum
                  forumId: 66666666-6666-4666-8666-666666666666
              groupActivity:
                summary: Group activity
                value:
                  audience: group-activity
                  groupActivityId: 77777777-7777-4777-8777-777777777777
              external:
                summary: External link
                value:
                  audience: external
      responses:
        '201':
          description: Share created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
              examples:
                owner:
                  summary: Share to a recipient Owner
                  value:
                    id: 88888888-8888-4888-8888-888888888888
                    activityId: 33333333-3333-4333-8333-333333333333
                    audience: owner
                    recipientOwnerId: 55555555-5555-4555-8555-555555555555
                external:
                  summary: External Share
                  value:
                    id: 99999999-9999-4999-8999-999999999999
                    activityId: 33333333-3333-4333-8333-333333333333
                    audience: external
                    link: /shares/external/opaquecapabilitytoken
                    summary: Nori walked for 30 minutes.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/PetDeactivated'
        '503':
          description: |
            Owner & Pet Manager (`urn:my-pet-care:owner-pet-manager-unavailable`)
            or, for a Forum or Group activity audience, the Community collaborator
            (`urn:my-pet-care:community-collaborator-unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                ownerPetManager:
                  summary: Owner & Pet Manager cannot be reached
                  value:
                    type: urn:my-pet-care:owner-pet-manager-unavailable
                    title: Service Unavailable
                    status: 503
                    detail: Owner & Pet Manager could not be reached.
                communityCollaborator:
                  summary: Community collaborator cannot be reached
                  value:
                    type: urn:my-pet-care:community-collaborator-unavailable
                    title: Service Unavailable
                    status: 503
                    detail: The Community collaborator could not be reached.
        '500':
          $ref: '#/components/responses/InternalError'
  /shares/{shareId}:
    parameters:
      - $ref: '#/components/parameters/ShareId'
    get:
      tags: [Shares]
      operationId: resolveShare
      summary: Resolve Share
      description: |
        AM-FR-012. Returns the Share snapshot frozen at share-create time.
        The caller is the recipient Owner, or an Owner with Belonging in the
        Community that contains the Forum or Group activity. The Pet's Owner
        does not use this route. A missing id or a caller who is not the
        audience is `404`. A revoked Share or a hard-deleted Activity is `410`.
      responses:
        '200':
          description: Frozen Share snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareSnapshot'
              example:
                petDisplayName: Nori
                activityTypeLabel: Walk
                timestamp: '2026-09-28T08:30:00.000Z'
                durationMinutes: 30
                caloriesBurned: 86
                activityAmount: 2.4
                notes: Morning loop
                route:
                  points:
                    - latitude: 41.39
                      longitude: 2.17
                    - latitude: 41.4
                      longitude: 2.18
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '410':
          $ref: '#/components/responses/ShareUnavailable'
        '503':
          $ref: '#/components/responses/CommunityCollaboratorUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Shares]
      operationId: revokeShare
      summary: Revoke Share
      description: |
        AM-FR-013. Revokes this Share only. The Activity stays. Fails when the
        Pet is deactivated. An already revoked Share, or a Share whose Activity
        was hard-deleted, is `410`.
      responses:
        '204':
          description: Share revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/PetDeactivated'
        '410':
          $ref: '#/components/responses/ShareUnavailable'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /shares/external/{token}:
    parameters:
      - $ref: '#/components/parameters/ExternalToken'
    get:
      tags: [Shares]
      operationId: resolveExternalShare
      summary: Resolve external Share
      description: |
        AM-FR-012. Public capability URL (ADR-0019). `{token}` is the secret,
        not the share id. Unknown, revoked, and hard-deleted all return the
        same `410`.
      security: []
      responses:
        '200':
          description: Frozen Share snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareSnapshot'
              example:
                petDisplayName: Nori
                activityTypeLabel: Walk
                timestamp: '2026-09-28T08:30:00.000Z'
                durationMinutes: 30
                caloriesBurned: 86
                notes: Morning loop
        '410':
          $ref: '#/components/responses/ShareUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Owner JWT with claim `ownerId`, `aud` `my-pet-care`.
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      description: Pet id from Owner & Pet Manager.
      schema:
        $ref: '#/components/schemas/Uuid'
    ActivityTypeId:
      name: activityTypeId
      in: path
      required: true
      description: Activity type id returned on create or list.
      schema:
        $ref: '#/components/schemas/Uuid'
    ActivityId:
      name: activityId
      in: path
      required: true
      description: Activity id returned on create.
      schema:
        $ref: '#/components/schemas/Uuid'
    ShareId:
      name: shareId
      in: path
      required: true
      description: Share id returned on create. Not the external capability token.
      schema:
        $ref: '#/components/schemas/Uuid'
    ExternalToken:
      name: token
      in: path
      required: true
      description: Secret capability token. Not the share id.
      schema:
        $ref: '#/components/schemas/ExternalToken'
    From:
      name: from
      in: query
      required: true
      description: Inclusive start of the Activity timestamp range.
      schema:
        $ref: '#/components/schemas/Timestamp'
    To:
      name: to
      in: query
      required: true
      description: Inclusive end of the Activity timestamp range. Must be greater than or equal to `from`.
      schema:
        $ref: '#/components/schemas/Timestamp'
  responses:
    ValidationFailed:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:validation-failed
            title: Bad Request
            status: 400
            detail: The request is invalid.
    Unauthorized:
      description: Missing, invalid, or expired Bearer JWT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:unauthorized
            title: Unauthorized
            status: 401
            detail: Authentication is required to access this resource.
    Forbidden:
      description: Platform-default Activity type rename or delete.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:forbidden
            title: Forbidden
            status: 403
            detail: You are not allowed to perform this operation.
    ResourceNotFound:
      description: |
        Missing resource, or the caller is not allowed to see it. Same body
        either way (`urn:my-pet-care:resource-not-found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:resource-not-found
            title: Not Found
            status: 404
            detail: The requested resource was not found.
    Conflict:
      description: Soft-retired Activity type blocks rename or use on an Activity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:conflict
            title: Conflict
            status: 409
            detail: The request conflicts with the current state of the resource.
    PetDeactivated:
      description: The caller owns the Pet and the Pet is deactivated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:pet-deactivated
            title: Conflict
            status: 409
            detail: This Pet is deactivated.
    ShareUnavailable:
      description: |
        The Share was revoked or its Activity was hard-deleted. On
        `GET /shares/external/{token}` this is also the response for an unknown token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:share-unavailable
            title: Gone
            status: 410
            detail: This share is no longer available.
    OwnerPetManagerUnavailable:
      description: Owner & Pet Manager cannot be reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:owner-pet-manager-unavailable
            title: Service Unavailable
            status: 503
            detail: Owner & Pet Manager could not be reached.
    PetHealthUnavailable:
      description: Pet Health Service cannot be reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:pet-health-unavailable
            title: Service Unavailable
            status: 503
            detail: Pet Health Service could not be reached.
    CommunityCollaboratorUnavailable:
      description: The Community collaborator cannot be reached, including while it does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:community-collaborator-unavailable
            title: Service Unavailable
            status: 503
            detail: The Community collaborator could not be reached.
    InternalError:
      description: Unexpected failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:internal-error
            title: Internal Server Error
            status: 500
            detail: The service failed to handle this request.
  schemas:
    Uuid:
      type: string
      format: uuid
      description: RFC 4122 UUID.
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 instant.
    ExternalToken:
      type: string
      minLength: 1
      pattern: '^[A-Za-z0-9_-]+$'
      description: Secret capability token. Not a share id.
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          description: Stable URN (ADR-0014).
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Fixed sentence. No id or path.
    ActivityTypeScope:
      type: string
      enum: [platform, owner]
      description: "`platform` is a platform-default type. `owner` is a custom type for the caller."
    ActivityTypeLabel:
      type: string
      minLength: 1
      maxLength: 80
      description: Display label of an Activity type.
    CalorieFactor:
      type: number
      minimum: 0
      description: Coefficient in duration × latest weight × calorie factor. Not a kilocalorie amount.
    ActivityType:
      type: object
      additionalProperties: false
      required: [id, label, gpsCapable, calorieFactor, scope, softRetired]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        label:
          $ref: '#/components/schemas/ActivityTypeLabel'
        gpsCapable:
          type: boolean
          description: When true, an Activity of this type requires a route.
        calorieFactor:
          $ref: '#/components/schemas/CalorieFactor'
        scope:
          $ref: '#/components/schemas/ActivityTypeScope'
        softRetired:
          type: boolean
          description: True when the type is hidden from the pickable catalog and cannot be renamed or used for a new Activity.
    ActivityTypeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityType'
    CreateActivityTypeRequest:
      type: object
      additionalProperties: false
      required: [label, gpsCapable, calorieFactor]
      properties:
        label:
          $ref: '#/components/schemas/ActivityTypeLabel'
        gpsCapable:
          type: boolean
        calorieFactor:
          $ref: '#/components/schemas/CalorieFactor'
    RenameActivityTypeRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          $ref: '#/components/schemas/ActivityTypeLabel'
    DurationMinutes:
      type: integer
      minimum: 1
      description: Duration in minutes. This is the activity-duration Health metric value.
    ActivityAmount:
      type: number
      minimum: 0
      description: Optional type-dependent quantity, such as a distance or a count. Not the activity-duration Health metric.
    MediaRef:
      type: string
      minLength: 1
      maxLength: 2048
      description: Opaque media reference. This service does not run upload or storage.
    RoutePoint:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        recordedAt:
          $ref: '#/components/schemas/Timestamp'
    Route:
      type: object
      additionalProperties: false
      required: [points]
      description: |
        Completed route. At least two points. The service rejects an oversized
        route with `400`; the numeric size limit is in the test plan.
      properties:
        points:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/RoutePoint'
    Activity:
      type: object
      additionalProperties: false
      required:
        - id
        - petId
        - activityTypeId
        - timestamp
        - durationMinutes
        - caloriesBurned
        - calorieOverride
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        petId:
          $ref: '#/components/schemas/Uuid'
        activityTypeId:
          $ref: '#/components/schemas/Uuid'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        durationMinutes:
          $ref: '#/components/schemas/DurationMinutes'
        activityAmount:
          $ref: '#/components/schemas/ActivityAmount'
        caloriesBurned:
          type: number
          minimum: 0
          description: Effective Calories burned, either system-estimated or the Calorie override.
        calorieOverride:
          type: boolean
          description: True while an Owner Calorie override replaces the system estimate.
        notes:
          type: string
          minLength: 1
          maxLength: 2000
        mediaRefs:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MediaRef'
        route:
          $ref: '#/components/schemas/Route'
          description: Present if and only if the Activity type is GPS-capable.
    ActivityList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
    CreateActivityRequest:
      type: object
      additionalProperties: false
      required: [activityTypeId, timestamp, durationMinutes]
      properties:
        activityTypeId:
          $ref: '#/components/schemas/Uuid'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        durationMinutes:
          $ref: '#/components/schemas/DurationMinutes'
        activityAmount:
          $ref: '#/components/schemas/ActivityAmount'
        notes:
          type: string
          minLength: 1
          maxLength: 2000
        mediaRefs:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MediaRef'
        route:
          $ref: '#/components/schemas/Route'
          description: Required when the Activity type is GPS-capable. Rejected otherwise.
    UpdateActivityRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        At least one field. Omit a field to leave it unchanged. `null` clears
        `activityAmount`, `notes`, or `mediaRefs`. Do not send `route` as null;
        a route on a non-GPS type is `400`.
      properties:
        activityTypeId:
          $ref: '#/components/schemas/Uuid'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        durationMinutes:
          $ref: '#/components/schemas/DurationMinutes'
        activityAmount:
          oneOf:
            - $ref: '#/components/schemas/ActivityAmount'
            - type: 'null'
        notes:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 2000
            - type: 'null'
        mediaRefs:
          oneOf:
            - type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/MediaRef'
            - type: 'null'
        route:
          $ref: '#/components/schemas/Route'
    SetCalorieOverrideRequest:
      type: object
      additionalProperties: false
      required: [caloriesBurned]
      properties:
        caloriesBurned:
          type: number
          minimum: 0
          description: Explicit Calories burned. Replaces the system estimate until cleared.
    ShareAudience:
      type: string
      enum: [owner, forum, group-activity, external]
    CreateOwnerShareRequest:
      type: object
      additionalProperties: false
      required: [audience, recipientOwnerId]
      properties:
        audience:
          const: owner
        recipientOwnerId:
          $ref: '#/components/schemas/Uuid'
    CreateForumShareRequest:
      type: object
      additionalProperties: false
      required: [audience, forumId]
      properties:
        audience:
          const: forum
        forumId:
          $ref: '#/components/schemas/Uuid'
    CreateGroupActivityShareRequest:
      type: object
      additionalProperties: false
      required: [audience, groupActivityId]
      properties:
        audience:
          const: group-activity
        groupActivityId:
          $ref: '#/components/schemas/Uuid'
    CreateExternalShareRequest:
      type: object
      additionalProperties: false
      required: [audience]
      properties:
        audience:
          const: external
    CreateShareRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateOwnerShareRequest'
        - $ref: '#/components/schemas/CreateForumShareRequest'
        - $ref: '#/components/schemas/CreateGroupActivityShareRequest'
        - $ref: '#/components/schemas/CreateExternalShareRequest'
      discriminator:
        propertyName: audience
        mapping:
          owner: '#/components/schemas/CreateOwnerShareRequest'
          forum: '#/components/schemas/CreateForumShareRequest'
          group-activity: '#/components/schemas/CreateGroupActivityShareRequest'
          external: '#/components/schemas/CreateExternalShareRequest'
    OwnerShare:
      type: object
      additionalProperties: false
      required: [id, activityId, audience, recipientOwnerId]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        activityId:
          $ref: '#/components/schemas/Uuid'
        audience:
          const: owner
        recipientOwnerId:
          $ref: '#/components/schemas/Uuid'
    ForumShare:
      type: object
      additionalProperties: false
      required: [id, activityId, audience, forumId]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        activityId:
          $ref: '#/components/schemas/Uuid'
        audience:
          const: forum
        forumId:
          $ref: '#/components/schemas/Uuid'
    GroupActivityShare:
      type: object
      additionalProperties: false
      required: [id, activityId, audience, groupActivityId]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        activityId:
          $ref: '#/components/schemas/Uuid'
        audience:
          const: group-activity
        groupActivityId:
          $ref: '#/components/schemas/Uuid'
    ExternalShare:
      type: object
      additionalProperties: false
      required: [id, activityId, audience, link, summary]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        activityId:
          $ref: '#/components/schemas/Uuid'
        audience:
          const: external
        link:
          type: string
          minLength: 1
          description: Capability path `/shares/external/{token}`. The token is the secret.
        summary:
          type: string
          minLength: 1
          maxLength: 500
          description: Text for the client OS share sheet, fixed at share-create time.
    Share:
      oneOf:
        - $ref: '#/components/schemas/OwnerShare'
        - $ref: '#/components/schemas/ForumShare'
        - $ref: '#/components/schemas/GroupActivityShare'
        - $ref: '#/components/schemas/ExternalShare'
      discriminator:
        propertyName: audience
        mapping:
          owner: '#/components/schemas/OwnerShare'
          forum: '#/components/schemas/ForumShare'
          group-activity: '#/components/schemas/GroupActivityShare'
          external: '#/components/schemas/ExternalShare'
    ShareSnapshot:
      type: object
      additionalProperties: false
      required:
        - petDisplayName
        - activityTypeLabel
        - timestamp
        - durationMinutes
        - caloriesBurned
      description: Frozen at share-create time. Not the live Activity.
      properties:
        petDisplayName:
          type: string
          minLength: 1
          description: Pet name from Owner & Pet Manager at share-create time.
        activityTypeLabel:
          $ref: '#/components/schemas/ActivityTypeLabel'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        durationMinutes:
          $ref: '#/components/schemas/DurationMinutes'
        caloriesBurned:
          type: number
          minimum: 0
        activityAmount:
          $ref: '#/components/schemas/ActivityAmount'
        notes:
          type: string
          minLength: 1
          maxLength: 2000
        mediaRefs:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MediaRef'
        route:
          $ref: '#/components/schemas/Route'
