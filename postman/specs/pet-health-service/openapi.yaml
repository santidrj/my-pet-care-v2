          $ref: '#/components/responses/PetDeactivated'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Medications
      operationId: listMedications
      summary: List Medications
      description: |
        PHS-FR-015. Results are `startDate` descending. Allowed when the Pet is
        deactivated.
      responses:
        '200':
          description: Medications. Empty `items` when none exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationList'
              example:
                items:
                  - id: 99999999-9999-4999-8999-999999999999
                    petId: 44444444-4444-4444-8444-444444444444
                    drugName: Amoxicillin
                    dosageInstructions: 250 mg twice a day with food
                    startDate: '2026-09-15'
                    endDate: '2026-09-25'
                    vetVisitId: 88888888-8888-4888-8888-888888888888
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /medications/{medicationId}:
    parameters:
      - $ref: '#/components/parameters/MedicationId'
    get:
      tags:
        - Medications
      operationId: getMedication
      summary: Get Medication
      description: PHS-FR-015. Allowed when the Pet is deactivated.
      responses:
        '200':
          description: Medication found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
              example:
                id: 99999999-9999-4999-8999-999999999999
                petId: 44444444-4444-4444-8444-444444444444
                drugName: Amoxicillin
                dosageInstructions: 250 mg twice a day with food
                startDate: '2026-09-15'
                endDate: '2026-09-25'
                vetVisitId: 88888888-8888-4888-8888-888888888888
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Medications
      operationId: updateMedication
      summary: Update Medication
      description: |
        PHS-FR-015. Partial update. `null` clears `endDate` or `vetVisitId`. A
        Vet visit that is missing or belongs to another Pet is `404`. The
        resulting `endDate` must be on or after `startDate`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMedicationRequest'
            example:
              endDate: '2026-09-29'
      responses:
        '200':
          description: Medication updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
              example:
                id: 99999999-9999-4999-8999-999999999999
                petId: 44444444-4444-4444-8444-444444444444
                drugName: Amoxicillin
                dosageInstructions: 250 mg twice a day with food
                startDate: '2026-09-15'
                endDate: '2026-09-29'
                vetVisitId: 88888888-8888-4888-8888-888888888888
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/PetDeactivated'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Medications
      operationId: deleteMedication
      summary: Hard-delete Medication
      description: PHS-FR-015. Permanent.
      responses:
        '204':
          description: Medication hard-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/PetDeactivated'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Owner JWT with claim `ownerId` and `aud` `my-pet-care`, or a platform
        JWT with claim `service` and `aud` `my-pet-care:platform` (ADR-0016).
        Only `activity-manager` is an accepted platform caller, and only on the
        routes that say so.
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      description: Pet id from Owner & Pet Manager.
      schema:
        $ref: '#/components/schemas/Uuid'
    WeightMetricId:
      name: metricId
      in: path
      required: true
      description: Weight Health metric id returned on record.
      schema:
        $ref: '#/components/schemas/Uuid'
    MealId:
      name: mealId
      in: path
      required: true
      description: Meal id returned on create. Also the id of its calories-consumed Health metric.
      schema:
        $ref: '#/components/schemas/Uuid'
    ActivityId:
      name: activityId
      in: path
      required: true
      description: Activity id from Activity Manager. Also the id of its activity-duration Health metric.
      schema:
        $ref: '#/components/schemas/Uuid'
    WashId:
      name: washId
      in: path
      required: true
      description: Wash id returned on register.
      schema:
        $ref: '#/components/schemas/Uuid'
    VetVisitId:
      name: vetVisitId
      in: path
      required: true
      description: Vet visit id returned on create.
      schema:
        $ref: '#/components/schemas/Uuid'
    MedicationId:
      name: medicationId
      in: path
      required: true
      description: Medication id returned on create.
      schema:
        $ref: '#/components/schemas/Uuid'
    From:
      name: from
      in: query
      required: false
      description: Optional inclusive start of the timestamp range.
      schema:
        $ref: '#/components/schemas/Timestamp'
    To:
      name: to
      in: query
      required: false
      description: Optional inclusive end of the timestamp range. When both are sent, must be greater
        than or equal to `from`.
      schema:
        $ref: '#/components/schemas/Timestamp'
    RangeFrom:
      name: from
      in: query
      required: true
      description: Inclusive start of the Meal timestamp range.
      schema:
        $ref: '#/components/schemas/Timestamp'
    RangeTo:
      name: to
      in: query
      required: true
      description: Inclusive end of the Meal timestamp range. Must be greater than or equal to `from`.
      schema:
        $ref: '#/components/schemas/Timestamp'
  responses:
    ValidationFailed:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:validation-failed
            title: Bad Request
            status: 400
            detail: The request is invalid.
    Unauthorized:
      description: Missing, invalid, or expired Bearer JWT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:unauthorized
            title: Unauthorized
            status: 401
            detail: Authentication is required to access this resource.
    Forbidden:
      description: |
        The kind of caller can never perform this operation: a platform service
        on an Owner route, a platform service other than Activity Manager, or an
        Owner on an Activity Manager route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:forbidden
            title: Forbidden
            status: 403
            detail: You are not allowed to perform this operation.
    ResourceNotFound:
      description: |
        Missing resource, or the caller is not allowed to see it. Same body
        either way (`urn:my-pet-care:resource-not-found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:resource-not-found
            title: Not Found
            status: 404
            detail: The requested resource was not found.
    PetDeactivated:
      description: The caller owns the Pet and the Pet is deactivated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:pet-deactivated
            title: Conflict
            status: 409
            detail: This Pet is deactivated.
    OwnerPetManagerUnavailable:
      description: Owner & Pet Manager cannot be reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:owner-pet-manager-unavailable
            title: Service Unavailable
            status: 503
            detail: Owner & Pet Manager could not be reached.
    InternalError:
      description: Unexpected failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:my-pet-care:internal-error
            title: Internal Server Error
            status: 500
            detail: The service failed to handle this request.
  schemas:
    Uuid:
      type: string
      format: uuid
      description: RFC 4122 UUID.
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 instant.
    CalendarDate:
      type: string
      format: date
      description: ISO-8601 calendar date (`YYYY-MM-DD`), read as a UTC date.
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: Stable URN (ADR-0014).
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Fixed sentence. No id or path.
    WeightKg:
      type: number
      exclusiveMinimum: 0
      description: Weight in kilograms.
    Kilocalories:
      type: integer
      minimum: 0
      description: Kilocalories.
    DurationMinutes:
      type: integer
      minimum: 1
      description: Activity duration in minutes.
    Notes:
      type: string
      minLength: 1
      maxLength: 2000
    HealthProfile:
      type: object
      additionalProperties: false
      description: Always exists for an existing Pet. There is no create or delete.
      required:
        - petId
        - latestWeightKg
        - recommendedDailyKilocalories
        - recommendedDailyKilocaloriesOverridden
      properties:
        petId:
          $ref: '#/components/schemas/Uuid'
        latestWeightKg:
          oneOf:
            - $ref: '#/components/schemas/WeightKg'
            - type: 'null'
          description: Value of the remaining weight Health metric with the latest timestamp. `null` when
            none remain.
        recommendedDailyKilocalories:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
          description: |
            The Owner override while one is in effect, otherwise derived from latest
            weight and species. `null` when there is no override and no latest weight.
        recommendedDailyKilocaloriesOverridden:
          type: boolean
          description: True while an Owner override replaces the derived value.
    SetRecommendedDailyKilocaloriesOverrideRequest:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          type: integer
          minimum: 1
          description: Recommended daily kilocalories set by the Owner.
    WeightMetric:
      type: object
      additionalProperties: false
      required:
        - id
        - petId
        - weightKg
        - timestamp
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        petId:
          $ref: '#/components/schemas/Uuid'
        weightKg:
          $ref: '#/components/schemas/WeightKg'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    WeightMetricList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeightMetric'
    CreateWeightMetricRequest:
      type: object
      additionalProperties: false
      required:
        - weightKg
        - timestamp
      properties:
        weightKg:
          $ref: '#/components/schemas/WeightKg'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    UpdateWeightMetricRequest:
      type: object
      additionalProperties: false
      description: At least one field. Omit a field to leave it unchanged.
      minProperties: 1
      properties:
        weightKg:
          $ref: '#/components/schemas/WeightKg'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    CaloriesConsumedMetric:
      type: object
      additionalProperties: false
      description: Written only through its Meal.
      required:
        - id
        - petId
        - kilocalories
        - timestamp
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Equal to the Meal id (ADR-0024).
        petId:
          $ref: '#/components/schemas/Uuid'
        kilocalories:
          $ref: '#/components/schemas/Kilocalories'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    CaloriesConsumedMetricList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaloriesConsumedMetric'
    ActivityDurationMetric:
      type: object
      additionalProperties: false
      description: Written only by Activity Manager.
      required:
        - id
        - petId
        - durationMinutes
        - timestamp
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Equal to the Activity id in Activity Manager (ADR-0024).
        petId:
          $ref: '#/components/schemas/Uuid'
        durationMinutes:
          $ref: '#/components/schemas/DurationMinutes'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    ActivityDurationMetricList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityDurationMetric'
    SyncActivityDurationMetricRequest:
      type: object
      additionalProperties: false
      required:
        - petId
        - durationMinutes
        - timestamp
      properties:
        petId:
          $ref: '#/components/schemas/Uuid'
        durationMinutes:
          $ref: '#/components/schemas/DurationMinutes'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
          description: The Activity's timestamp.
    MealLabel:
      type: string
      minLength: 1
      maxLength: 40
    Meal:
      type: object
      additionalProperties: false
      description: '`brand` and `notes` are present only when set.'
      required:
        - id
        - petId
        - foodName
        - kilocalories
        - timestamp
        - labels
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        petId:
          $ref: '#/components/schemas/Uuid'
        foodName:
          type: string
          minLength: 1
          maxLength: 120
        kilocalories:
          $ref: '#/components/schemas/Kilocalories'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        brand:
          type: string
          minLength: 1
          maxLength: 120
        labels:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MealLabel'
          description: Short free-text tags. Empty when none.
        notes:
          $ref: '#/components/schemas/Notes'
    MealList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Meal'
    CreateMealRequest:
      type: object
      additionalProperties: false
      required:
        - foodName
        - kilocalories
        - timestamp
      properties:
        foodName:
          type: string
          minLength: 1
          maxLength: 120
        kilocalories:
          $ref: '#/components/schemas/Kilocalories'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        brand:
          type: string
          minLength: 1
          maxLength: 120
        labels:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MealLabel'
          description: Short free-text tags. Empty when none.
        notes:
          $ref: '#/components/schemas/Notes'
    UpdateMealRequest:
      type: object
      additionalProperties: false
      description: |
        At least one field. Omit a field to leave it unchanged. `null` clears
        `brand` or `notes`. `[]` clears `labels`.
      minProperties: 1
      properties:
        foodName:
          type: string
          minLength: 1
          maxLength: 120
        kilocalories:
          $ref: '#/components/schemas/Kilocalories'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        brand:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 120
            - type: 'null'
        labels:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MealLabel'
          description: Short free-text tags. Empty when none.
        notes:
          oneOf:
            - $ref: '#/components/schemas/Notes'
            - type: 'null'
    KilocaloriesEaten:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - kilocalories
      properties:
        from:
          $ref: '#/components/schemas/Timestamp'
        to:
          $ref: '#/components/schemas/Timestamp'
        kilocalories:
          $ref: '#/components/schemas/Kilocalories'
          description: Sum of Meal kilocalories in the range. `0` when none.
    Wash:
      type: object
      additionalProperties: false
      description: '`notes` is present only when set.'
      required:
        - id
        - petId
        - timestamp
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        petId:
          $ref: '#/components/schemas/Uuid'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        notes:
          $ref: '#/components/schemas/Notes'
    WashList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Wash'
    CreateWashRequest:
      type: object
      additionalProperties: false
      required:
        - timestamp
      properties:
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        notes:
          $ref: '#/components/schemas/Notes'
    UpdateWashRequest:
      type: object
      additionalProperties: false
      description: At least one field. Omit a field to leave it unchanged. `null` clears `notes`.
      minProperties: 1
      properties:
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        notes:
          oneOf:
            - $ref: '#/components/schemas/Notes'
            - type: 'null'
    IntervalDays:
      type: integer
      minimum: 1
      description: Recurring interval in whole days.
    WashSchedule:
      type: object
      additionalProperties: false
      required:
        - petId
        - startDate
        - intervalDays
      properties:
        petId:
          $ref: '#/components/schemas/Uuid'
        startDate:
          $ref: '#/components/schemas/CalendarDate'
        intervalDays:
          $ref: '#/components/schemas/IntervalDays'
    SetWashScheduleRequest:
      type: object
      additionalProperties: false
      required:
        - startDate
        - intervalDays
      properties:
        startDate:
          $ref: '#/components/schemas/CalendarDate'
          description: On or after the current UTC date.
        intervalDays:
          $ref: '#/components/schemas/IntervalDays'
    UpdateWashScheduleRequest:
      type: object
      additionalProperties: false
      description: At least one field. Omit a field to leave it unchanged.
      minProperties: 1
      properties:
        startDate:
          $ref: '#/components/schemas/CalendarDate'
          description: On or after the current UTC date. Becomes the new anchor.
        intervalDays:
          $ref: '#/components/schemas/IntervalDays'
    ScheduledNextDueWash:
      type: object
      additionalProperties: false
      required:
        - status
        - nextDue
      properties:
        status:
          const: scheduled
        nextDue:
          $ref: '#/components/schemas/CalendarDate'
    NotScheduledNextDueWash:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          const: not-scheduled
    NextDueWash:
      oneOf:
        - $ref: '#/components/schemas/ScheduledNextDueWash'
        - $ref: '#/components/schemas/NotScheduledNextDueWash'
      discriminator:
        propertyName: status
        mapping:
          scheduled: '#/components/schemas/ScheduledNextDueWash'
          not-scheduled: '#/components/schemas/NotScheduledNextDueWash'
    VetVisit:
      type: object
      additionalProperties: false
      required:
        - id
        - petId
        - visitedAt
        - clinicName
        - reason
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        petId:
          $ref: '#/components/schemas/Uuid'
        visitedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the visit happened.
        clinicName:
          type: string
          minLength: 1
          maxLength: 120
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Reason for the visit or a summary of it.
    VetVisitList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VetVisit'
    CreateVetVisitRequest:
      type: object
      additionalProperties: false
      required:
        - visitedAt
        - clinicName
        - reason
      properties:
        visitedAt:
          $ref: '#/components/schemas/Timestamp'
        clinicName:
          type: string
          minLength: 1
          maxLength: 120
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    UpdateVetVisitRequest:
      type: object
      additionalProperties: false
      description: At least one field. Omit a field to leave it unchanged.
      minProperties: 1
      properties:
        visitedAt:
          $ref: '#/components/schemas/Timestamp'
        clinicName:
          type: string
          minLength: 1
          maxLength: 120
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    Medication:
      type: object
      additionalProperties: false
      description: |
        A treatment course. `endDate` and `vetVisitId` are present only when set.
        Hard-deleting the linked Vet visit removes `vetVisitId`.
      required:
        - id
        - petId
        - drugName
        - dosageInstructions
        - startDate
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        petId:
          $ref: '#/components/schemas/Uuid'
        drugName:
          type: string
          minLength: 1
          maxLength: 120
        dosageInstructions:
          type: string
          minLength: 1
          maxLength: 2000
        startDate:
          $ref: '#/components/schemas/CalendarDate'
        endDate:
          $ref: '#/components/schemas/CalendarDate'
          description: On or after `startDate`.
        vetVisitId:
          $ref: '#/components/schemas/Uuid'
          description: Linked Vet visit of the same Pet.
    MedicationList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Medication'
    CreateMedicationRequest:
      type: object
      additionalProperties: false
      required:
        - drugName
        - dosageInstructions
        - startDate
      properties:
        drugName:
          type: string
          minLength: 1
          maxLength: 120
        dosageInstructions:
          type: string
          minLength: 1
          maxLength: 2000
        startDate:
          $ref: '#/components/schemas/CalendarDate'
        endDate:
          $ref: '#/components/schemas/CalendarDate'
        vetVisitId:
          $ref: '#/components/schemas/Uuid'
    UpdateMedicationRequest:
      type: object
      additionalProperties: false
      description: |
        At least one field. Omit a field to leave it unchanged. `null` clears
        `endDate` or `vetVisitId`.
      minProperties: 1
      properties:
        drugName:
          type: string
          minLength: 1
          maxLength: 120
        dosageInstructions:
          type: string
          minLength: 1
          maxLength: 2000
        startDate:
          $ref: '#/components/schemas/CalendarDate'
        endDate:
          oneOf:
            - $ref: '#/components/schemas/CalendarDate'
            - type: 'null'
        vetVisitId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    MedicalRecord:
      type: object
      additionalProperties: false
      required:
        - petId
