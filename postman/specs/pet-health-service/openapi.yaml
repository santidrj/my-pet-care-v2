  /pets/{petId}/wash-schedule:
    parameters:
      - $ref: '#/components/parameters/PetId'
    put:
      tags:
        - Wash schedule
      operationId: setWashSchedule
      summary: Set Wash schedule
      description: |
        PHS-FR-010. Creates the Pet's Wash schedule. `startDate` must be on or
        after the current UTC date. A schedule that already exists is `409`
        `conflict`; change it with `PATCH`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWashScheduleRequest'
            example:
              startDate: '2026-10-01'
              intervalDays: 14
      responses:
        '201':
          description: Wash schedule set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WashSchedule'
              example:
                petId: 44444444-4444-4444-8444-444444444444
                startDate: '2026-10-01'
                intervalDays: 14
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: |
            A Wash schedule already exists (`urn:my-pet-care:conflict`), or the Pet
            is deactivated (`urn:my-pet-care:pet-deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                scheduleExists:
                  summary: A Wash schedule already exists
                  value:
                    type: urn:my-pet-care:conflict
                    title: Conflict
                    status: 409
                    detail: The request conflicts with the current state of the resource.
                petDeactivated:
                  summary: Pet is deactivated
                  value:
                    type: urn:my-pet-care:pet-deactivated
                    title: Conflict
                    status: 409
                    detail: This Pet is deactivated.
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Wash schedule
      operationId: getWashSchedule
      summary: Get Wash schedule
      description: PHS-FR-010. No schedule is `404`. Allowed when the Pet is deactivated.
      responses:
        '200':
          description: Wash schedule found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WashSchedule'
              example:
                petId: 44444444-4444-4444-8444-444444444444
                startDate: '2026-10-01'
                intervalDays: 14
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Wash schedule
      operationId: updateWashSchedule
      summary: Update Wash schedule
      description: |
        PHS-FR-010. Partial update. A sent `startDate` must be on or after the
        current UTC date and becomes the new anchor. Washes before it no longer
        move next due. An `intervalDays`-only change does not re-check the
        stored start date. No schedule is `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWashScheduleRequest'
            example:
              intervalDays: 21
      responses:
        '200':
          description: Wash schedule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WashSchedule'
              example:
                petId: 44444444-4444-4444-8444-444444444444
                startDate: '2026-10-01'
                intervalDays: 21
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/PetDeactivated'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Wash schedule
      operationId: deleteWashSchedule
      summary: Hard-delete Wash schedule
      description: |
        PHS-FR-010. Hard delete. Washes remain. Next due is `not-scheduled` until
        a new schedule is set. No schedule is `404`.
      responses:
        '204':
          description: Wash schedule deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/PetDeactivated'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
