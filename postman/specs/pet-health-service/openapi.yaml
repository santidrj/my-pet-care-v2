openapi: 3.1.0
info:
  title: Pet Health Service
  version: 0.1.0
  description: |
    REST API for the Pet Health Service (ADR-0004).

    Behavioral requirements: `docs/requirements/pet-health-service.md`.
    HTTP route map: `docs/requirements/pet-health-service-api.md`.

    Calories-consumed and activity-duration Health metrics use the id of the
    Meal or Activity they come from (ADR-0024). Activity Manager writes
    activity-duration metrics with a platform JWT. Errors use RFC 9457
    Problem Details (ADR-0010, ADR-0014). At runtime the error Content-Type
    is `application/problem+json`; this OpenAPI file documents those bodies
    under `application/json` so Postman lint accepts the media type.
servers:
  - url: '{baseUrl}'
    description: Local or deployed Pet Health Service base URL
    variables:
      baseUrl:
        default: http://localhost:3002
tags:
  - name: Health
    description: Process liveness (not a PHS-FR)
  - name: Health profile
    description: Latest weight and recommended daily kilocalories
  - name: Weight metrics
    description: Weight Health metrics the Owner records
  - name: Calories-consumed metrics
    description: Calories-consumed Health metrics written through Meals
  - name: Activity-duration metrics
    description: Activity-duration Health metrics written by Activity Manager
  - name: Meals
    description: Meals and kilocalories eaten
  - name: Washes
    description: Completed Washes
  - name: Wash schedule
    description: Wash schedule and next due
  - name: Medical record
    description: Read-only view of Vet visits and Medications
  - name: Vet visits
    description: Vet visits for a Pet
  - name: Medications
    description: Medication courses for a Pet
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Liveness
      description: Public process liveness. No Bearer JWT. Not a PHS-FR.
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
  /pets/{petId}/health-profile:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags:
        - Health profile
      operationId: getHealthProfile
      summary: Get Health profile
      description: |
        PHS-FR-001. Callable by the Pet's Owner or by Activity Manager (platform
        JWT with `service` `activity-manager`) for latest-weight reads. Both
        fields are always present and `null` when empty. Allowed when the Pet is
        deactivated. Any other platform service is `403`.
      responses:
        '200':
          description: Health profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthProfile'
              example:
                petId: 44444444-4444-4444-8444-444444444444
                latestWeightKg: 12.4
                recommendedDailyKilocalories: 740
                recommendedDailyKilocaloriesOverridden: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /pets/{petId}/health-profile/recommended-daily-kilocalories-override:
    parameters:
      - $ref: '#/components/parameters/PetId'
    put:
      tags:
        - Health profile
      operationId: setRecommendedDailyKilocaloriesOverride
      summary: Set recommended daily kilocalories override
      description: |
        PHS-FR-006. Replaces the derived value, or an earlier override, until
        the Owner clears it. Later weight changes do not change it. Response is
        the Health profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRecommendedDailyKilocaloriesOverrideRequest'
            example:
              value: 650
      responses:
        '200':
          description: Override set. Body is the Health profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthProfile'
              example:
                petId: 44444444-4444-4444-8444-444444444444
                latestWeightKg: 12.4
                recommendedDailyKilocalories: 650
                recommendedDailyKilocaloriesOverridden: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/PetDeactivated'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Health profile
      operationId: clearRecommendedDailyKilocaloriesOverride
      summary: Clear recommended daily kilocalories override
      description: |
        PHS-FR-005 and PHS-FR-006. Removes the override and derives the value
        from the current latest weight and species. The value is `null` when
        latest weight is empty. Clearing when no override is in effect succeeds
        unchanged. An unexpected species from Owner & Pet Manager is `500`.
        Response is the Health profile.
      responses:
        '200':
          description: Override cleared. Body is the Health profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthProfile'
              example:
                petId: 44444444-4444-4444-8444-444444444444
                latestWeightKg: 12.4
                recommendedDailyKilocalories: 740
                recommendedDailyKilocaloriesOverridden: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/PetDeactivated'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /pets/{petId}/weight-metrics:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags:
        - Weight metrics
      operationId: recordWeight
      summary: Record weight
      description: |
        PHS-FR-002. Appends a weight Health metric. Latest weight becomes the
        remaining weight metric with the latest timestamp, which may be an older
        reading when this one is backdated. With no override in effect,
        recommended daily kilocalories is derived again. An unexpected species
        from Owner & Pet Manager is `500` and nothing is recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWeightMetricRequest'
            example:
              weightKg: 12.4
              timestamp: '2026-09-28T07:45:00.000Z'
      responses:
        '201':
          description: Weight Health metric recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightMetric'
              example:
                id: 55555555-5555-4555-8555-555555555555
                petId: 44444444-4444-4444-8444-444444444444
                weightKg: 12.4
                timestamp: '2026-09-28T07:45:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/PetDeactivated'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Weight metrics
      operationId: listWeightMetrics
      summary: List weight Health metrics
      description: |
        PHS-FR-003. Optional `from` and `to` filter on the metric timestamp and
        include both ends. Results are timestamp descending. Allowed when the Pet
        is deactivated.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Weight Health metrics. Empty `items` when none match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightMetricList'
              example:
                items:
                  - id: 55555555-5555-4555-8555-555555555555
                    petId: 44444444-4444-4444-8444-444444444444
                    weightKg: 12.4
                    timestamp: '2026-09-28T07:45:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /weight-metrics/{metricId}:
    parameters:
      - $ref: '#/components/parameters/WeightMetricId'
    get:
      tags:
        - Weight metrics
      operationId: getWeightMetric
      summary: Get weight Health metric
      description: PHS-FR-003. Allowed when the Pet is deactivated.
      responses:
        '200':
          description: Weight Health metric found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightMetric'
              example:
                id: 55555555-5555-4555-8555-555555555555
                petId: 44444444-4444-4444-8444-444444444444
                weightKg: 12.4
                timestamp: '2026-09-28T07:45:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Weight metrics
      operationId: correctWeightMetric
      summary: Correct weight Health metric
      description: |
        PHS-FR-004. Partial update of `weightKg` and `timestamp`. Latest weight
        and, with no override in effect, recommended daily kilocalories are
        derived again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWeightMetricRequest'
            example:
              weightKg: 12.2
      responses:
        '200':
          description: Weight Health metric corrected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightMetric'
              example:
                id: 55555555-5555-4555-8555-555555555555
                petId: 44444444-4444-4444-8444-444444444444
                weightKg: 12.2
                timestamp: '2026-09-28T07:45:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/PetDeactivated'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Weight metrics
      operationId: deleteWeightMetric
      summary: Hard-delete weight Health metric
      description: |
        PHS-FR-004. Hard delete. Latest weight and, with no override in effect,
        recommended daily kilocalories are derived again, and are `null` when no
        weight metric remains.
      responses:
        '204':
          description: Weight Health metric deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/PetDeactivated'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /pets/{petId}/calories-consumed-metrics:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags:
        - Calories-consumed metrics
      operationId: listCaloriesConsumedMetrics
      summary: List calories-consumed Health metrics
      description: |
        PHS-FR-017. Read-only. Meals are the only write path. Optional `from` and
        `to` filter on the metric timestamp and include both ends. Results are
        timestamp descending. Allowed when the Pet is deactivated.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Calories-consumed Health metrics. Empty `items` when none match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaloriesConsumedMetricList'
              example:
                items:
                  - id: 66666666-6666-4666-8666-666666666666
                    petId: 44444444-4444-4444-8444-444444444444
                    kilocalories: 320
                    timestamp: '2026-09-28T07:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /calories-consumed-metrics/{mealId}:
    parameters:
      - $ref: '#/components/parameters/MealId'
    get:
      tags:
        - Calories-consumed metrics
      operationId: getCaloriesConsumedMetric
      summary: Get calories-consumed Health metric
      description: |
        PHS-FR-017. The metric id is its Meal's id (ADR-0024). Allowed when the
        Pet is deactivated.
      responses:
        '200':
          description: Calories-consumed Health metric found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaloriesConsumedMetric'
              example:
                id: 66666666-6666-4666-8666-666666666666
                petId: 44444444-4444-4444-8444-444444444444
                kilocalories: 320
                timestamp: '2026-09-28T07:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /pets/{petId}/activity-duration-metrics:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags:
        - Activity-duration metrics
      operationId: listActivityDurationMetrics
      summary: List activity-duration Health metrics
      description: |
        PHS-FR-016. Owner read. Optional `from` and `to` filter on the metric
        timestamp and include both ends. Results are timestamp descending.
        Allowed when the Pet is deactivated.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Activity-duration Health metrics. Empty `items` when none match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDurationMetricList'
              example:
                items:
                  - id: 33333333-3333-4333-8333-333333333333
                    petId: 44444444-4444-4444-8444-444444444444
                    durationMinutes: 30
                    timestamp: '2026-09-28T08:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /activity-duration-metrics/{activityId}:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    get:
      tags:
        - Activity-duration metrics
      operationId: getActivityDurationMetric
      summary: Get activity-duration Health metric
      description: |
        PHS-FR-016. Owner read. The metric id is its Activity's id (ADR-0024).
        Allowed when the Pet is deactivated.
      responses:
        '200':
          description: Activity-duration Health metric found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDurationMetric'
              example:
                id: 33333333-3333-4333-8333-333333333333
                petId: 44444444-4444-4444-8444-444444444444
                durationMinutes: 30
                timestamp: '2026-09-28T08:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Activity-duration metrics
      operationId: syncActivityDurationMetric
      summary: Create or correct activity-duration Health metric
      description: |
        PHS-FR-016. Activity Manager only (platform JWT with `service`
        `activity-manager`). Any other caller, including an Owner, is `403`.
        Creates the metric for this Activity (`201`) or corrects it (`200`), so
        a retry is safe. A `petId` that differs from the stored one is `409`
        `conflict`. Fails when the Pet is missing (`404`) or deactivated (`409`
        `pet-deactivated`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncActivityDurationMetricRequest'
            example:
              petId: 44444444-4444-4444-8444-444444444444
              durationMinutes: 30
              timestamp: '2026-09-28T08:30:00.000Z'
      responses:
        '200':
          description: Activity-duration Health metric corrected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDurationMetric'
              example:
                id: 33333333-3333-4333-8333-333333333333
                petId: 44444444-4444-4444-8444-444444444444
                durationMinutes: 30
                timestamp: '2026-09-28T08:30:00.000Z'
        '201':
          description: Activity-duration Health metric created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDurationMetric'
              example:
                id: 33333333-3333-4333-8333-333333333333
                petId: 44444444-4444-4444-8444-444444444444
                durationMinutes: 30
                timestamp: '2026-09-28T08:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          description: |
            The metric belongs to a different Pet (`urn:my-pet-care:conflict`), or
            the Pet is deactivated (`urn:my-pet-care:pet-deactivated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                petMismatch:
                  summary: Stored metric belongs to a different Pet
                  value:
                    type: urn:my-pet-care:conflict
                    title: Conflict
                    status: 409
                    detail: The request conflicts with the current state of the resource.
                petDeactivated:
                  summary: Pet is deactivated
                  value:
                    type: urn:my-pet-care:pet-deactivated
                    title: Conflict
                    status: 409
                    detail: This Pet is deactivated.
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Activity-duration metrics
      operationId: deleteActivityDurationMetric
      summary: Hard-delete activity-duration Health metric
      description: |
        PHS-FR-016. Activity Manager only. Any other caller, including an Owner,
        is `403`. Succeeds when the Pet is deactivated. No metric for this
        Activity is `404`.
      responses:
        '204':
          description: Activity-duration Health metric deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /pets/{petId}/meals:
    parameters:
      - $ref: '#/components/parameters/PetId'
    post:
      tags:
        - Meals
      operationId: createMeal
      summary: Create Meal
      description: |
        PHS-FR-007. Registers a Meal and its calories-consumed Health metric
        (same kilocalories and timestamp, id equal to the Meal id). `brand`,
        `labels`, and `notes` are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMealRequest'
            example:
              foodName: Chicken and rice kibble
              kilocalories: 320
              timestamp: '2026-09-28T07:30:00.000Z'
              brand: Acme Pet Foods
              labels:
                - dry
                - breakfast
              notes: Ate everything
      responses:
        '201':
          description: Meal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
              example:
                id: 66666666-6666-4666-8666-666666666666
                petId: 44444444-4444-4444-8444-444444444444
                foodName: Chicken and rice kibble
                kilocalories: 320
                timestamp: '2026-09-28T07:30:00.000Z'
                brand: Acme Pet Foods
                labels:
                  - dry
                  - breakfast
                notes: Ate everything
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/PetDeactivated'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Meals
      operationId: listMeals
      summary: List Meals
      description: |
        PHS-FR-008. Optional `from` and `to` filter on the Meal timestamp and
        include both ends. Results are timestamp descending. Allowed when the Pet
        is deactivated.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Meals. Empty `items` when none match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealList'
              example:
                items:
                  - id: 66666666-6666-4666-8666-666666666666
                    petId: 44444444-4444-4444-8444-444444444444
                    foodName: Chicken and rice kibble
                    kilocalories: 320
                    timestamp: '2026-09-28T07:30:00.000Z'
                    brand: Acme Pet Foods
                    labels:
                      - dry
                      - breakfast
                    notes: Ate everything
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /meals/{mealId}:
    parameters:
      - $ref: '#/components/parameters/MealId'
    get:
      tags:
        - Meals
      operationId: getMeal
      summary: Get Meal
      description: PHS-FR-008. Allowed when the Pet is deactivated.
      responses:
        '200':
          description: Meal found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
              example:
                id: 66666666-6666-4666-8666-666666666666
                petId: 44444444-4444-4444-8444-444444444444
                foodName: Chicken and rice kibble
                kilocalories: 320
                timestamp: '2026-09-28T07:30:00.000Z'
                brand: Acme Pet Foods
                labels:
                  - dry
                  - breakfast
                notes: Ate everything
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '503':
          $ref: '#/components/responses/OwnerPetManagerUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Meals
      operationId: updateMeal
      summary: Update Meal
      description: |
        PHS-FR-008. Partial update. The calories-consumed Health metric takes the
        Meal's kilocalories and timestamp.
